# Cấu hình agent mẫu cho Linux (Ubuntu-01 / Web-01 Apache)
agent_id: "S001-Web-01"

server:
  url: "https://192.168.1.10:8000"     # IP máy chạy docker-compose (phải có trong MANAGER_TLS_IPS)
  ca_file: "/etc/siem-agent/ca.crt"   # copy từ volume certs: ca/ca.crt
  enrollment_key: "change-me-enrollment-key"  # hoặc đặt biến môi trường SIEM_ENROLLMENT_KEY
  timeout_seconds: 10
  retry_interval_seconds: 5
  batch_size: 100

queue:
  dir: "/var/lib/siem-agent"   # chứa token, queue, offset: agent tự chmod 700
  max_mb: 512                  # manager mất kết nối lâu, queue đầy thì collector tạm dừng (không vứt event)
  segment_mb: 16

log:
  level: "info"
  path: "/var/log/siem-agent.log"

collectors:
  mock: false
  process: true
  process_mode: auto           # auto: netlink (bắt cả tiến trình sống vài ms), không được thì quét /proc
  process_interval_seconds: 2  # chu kỳ quét /proc khi không dùng được netlink

# loại_log: đường dẫn (nhiều file cách nhau bởi dấu phẩy, được dùng wildcard, vd /var/log/nginx/*.log)
# loại hỗ trợ: apache_access, apache_error, auth, suricata, syslog
filetail:
  apache_access: "/var/log/apache2/access.log"
  apache_error: "/var/log/apache2/error.log"
  auth: "/var/log/auth.log, /var/log/secure"
  suricata: "/var/log/suricata/eve.json"

# Giám sát toàn vẹn file: băm định kỳ, báo file thêm / sửa / xóa (rule FIM-001..003)
fim:
  paths: "/etc/passwd, /etc/shadow, /etc/group, /etc/sudoers, /etc/sudoers.d, /etc/ssh/sshd_config, /etc/crontab, /etc/cron.d, /etc/systemd/system, /root/.ssh, /var/www"
  exclude: "*.swp, *.tmp, *~"
  interval_seconds: 300
  max_file_mb: 32

response:
  enabled: true
  dry_run: false          # true = chỉ log lệnh, không thực thi
  poll_interval_seconds: 5
