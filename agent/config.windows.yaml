# Cấu hình agent mẫu cho Windows (PC-01). Nên đặt file này trong C:\ProgramData\siem-agent
# (agent tự siết quyền thư mục: chỉ SYSTEM/Administrators đọc được, vì file chứa enrollment_key),
# rồi cài service bằng PowerShell Administrator:  .\siem-agent.exe -install -config C:\ProgramData\siem-agent\config.yaml
agent_id: "A001-PC-01"

server:
  url: "https://192.168.1.10:8000"
  ca_file: "C:\ProgramData\siem-agent\ca.crt"   # copy từ volume certs: ca/ca.crt
  enrollment_key: "change-me-enrollment-key"
  timeout_seconds: 10
  retry_interval_seconds: 5
  batch_size: 100

queue:
  dir: "C:\ProgramData\siem-agent"
  max_mb: 512

log:
  level: "info"
  path: "C:\ProgramData\siem-agent\agent.log"

collectors:
  windows_eventlog: true
  windows_interval_seconds: 5
  # Cài Sysmon (config SwiftOnSecurity) để có telemetry process/network chi tiết
  windows_channels: "Security, System, Microsoft-Windows-Sysmon/Operational, Microsoft-Windows-PowerShell/Operational, Microsoft-Windows-Windows Defender/Operational"

# Giám sát toàn vẹn file: file hosts, thư mục Startup (cơ chế duy trì), web root IIS
fim:
  paths: "C:\Windows\System32\drivers\etc, C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp, C:\inetpub\wwwroot"
  interval_seconds: 300

response:
  enabled: true
  dry_run: false
  poll_interval_seconds: 5
