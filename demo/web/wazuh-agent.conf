<!--
  Wazuh agent 4.14.7 trên máy web demo (vai trò S001). Entrypoint chép file này vào /var/ossec/etc/ossec.conf
  mỗi lần khởi động. Manager còn đẩy thêm cấu hình chung (wazuh/manager/agent.conf).
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>debian, debian12</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh-manager</manager_address>
      <agent_name>demo-web</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
    </enrollment>
  </client>

  <!-- Hàng đợi phía agent khi mất kết nối / đột biến -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- Kiểm kê: phần cứng, OS, gói, cổng, tiến trình (xem trong Wazuh API / manager DB) -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- Đánh giá cấu hình an toàn theo CIS (Debian) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- FIM: nội dung web + cấu hình Apache theo thời gian thực (kèm diff), thư mục hệ thống theo lịch -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes" report_changes="yes">/usr/local/apache2/htdocs,/usr/local/apache2/cgi-bin</directories>
    <directories realtime="yes">/usr/local/apache2/conf</directories>
    <directories>/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore>/etc/hostname</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>50</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <localfile>
    <log_format>apache</log_format>
    <location>/usr/local/apache2/logs/access_log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/usr/local/apache2/logs/error_log</location>
  </localfile>

  <!-- Kết quả lệnh phản ứng (script siem-xdr) -> gửi về để SOAR cập nhật trạng thái lệnh -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- Tiến trình mới mỗi giây (container không có auditd) -> rule LNX-* -->
  <localfile>
    <log_format>command</log_format>
    <command>/usr/local/sbin/siem-procs</command>
    <alias>siem-procs</alias>
    <frequency>1</frequency>
  </localfile>

  <active-response>
    <disabled>no</disabled>
    <ca_store>etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
