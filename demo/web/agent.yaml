# Cấu hình agent cho container demo-web (enrollment key lấy từ biến môi trường SIEM_ENROLLMENT_KEY)
agent_id: "demo-web"

server:
  url: "https://manager:8000"
  ca_file: "/certs/ca/ca.crt"
  timeout_seconds: 10
  retry_interval_seconds: 3
  batch_size: 200

queue:
  dir: "/var/lib/siem-agent"

collectors:
  process: true
  process_interval_seconds: 1

filetail:
  apache_access: "/usr/local/apache2/logs/access_log"
  apache_error: "/usr/local/apache2/logs/error_log"

response:
  enabled: true
  dry_run: false
  poll_interval_seconds: 3
