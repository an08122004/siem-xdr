# IP theo mô hình lab 4 vùng của DEPLOY-VM.md mục 0: DMZ 10.10.20.0/24, LAN 10.10.30.0/24, SOC 10.10.40.0/24,
# Internet giả 203.0.113.0/24. Đổi mô hình mạng thì sửa ở đây rồi `docker compose restart analyzer soar`.
- id: A001
  name: PC-01
  type: endpoint
  os: windows
  agent_id: A001-PC-01
  hostname: PC-01
