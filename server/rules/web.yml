# Luật phát hiện tấn công Web (nguồn: Apache access log)
- id: WEB-001
  title: Tấn công SQL Injection
  # Comment SQL giữa UNION và SELECT viết dạng không mơ hồ (nội dung không chứa */). Trước 13/10/2026 là
  # `union(\s|/\*.*?\*/|\+)+`: chuỗi `union/**//**/...` không có select làm regex quay lui theo cấp số nhân (20 comment
  # 0,25 giây, mỗi 2 comment thêm chậm gấp 4) -> một request treo được analyzer (ReDoS). Lint (tools/rule_lint.py) bắt lỗi này.
  description: URL chứa payload SQL injection điển hình (UNION SELECT, OR 1=1, SLEEP, comment...)
  severity: high
  mitre: {tactic: Initial Access, technique: [T1190]}
  tags: [web, sqli, owasp-a03]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Máy quét lỗ hổng / pentest được phép (Nessus, OpenVAS, Burp của đội an ninh)"
    - "Ứng dụng truyền câu SQL hoặc văn bản có từ khóa SQL qua URL (công cụ quản trị CSDL trên web)"
  type: match
  suppress: 60
  group_by: [source.ip]
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - field: url.decoded
        op: regex
        value:
          - "union(?:\\s|\\+|/\\*(?:(?!\\*/).)*\\*/)+(?:all\\s+)?select"
          - "'\\s*(or|and)\\s*'?\\d+'?\\s*=\\s*'?\\d+"
          - "'\\s*(or|and)\\s+'[^']*'\\s*=\\s*'"
          - "\\b(sleep|benchmark|pg_sleep)\\s*\\("
          - "waitfor\\s+delay"
          - "information_schema|sysobjects|@@version"
          - "(;|')\\s*(drop|insert|update|delete)\\s+"
          - "'\\s*--|'\\s*#"

- id: WEB-002
  title: Tấn công Cross-Site Scripting (XSS)
  severity: medium
  mitre: {tactic: Initial Access, technique: [T1189]}
  tags: [web, xss, owasp-a03]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Máy quét lỗ hổng / pentest được phép (Nessus, OpenVAS, Burp của đội an ninh)"
    - "CMS / trang soạn thảo gửi HTML trong tham số URL"
  type: match
  suppress: 60
  group_by: [source.ip]
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - field: url.decoded
        op: regex
        value: ["<\\s*script", "javascript\\s*:", "on(error|load|mouseover|focus)\\s*=", "<\\s*(img|svg|iframe)[^>]*>", "document\\.cookie", "alert\\s*\\("]

- id: WEB-003
  title: Path Traversal / Local File Inclusion
  severity: high
  mitre: {tactic: Initial Access, technique: [T1190]}
  tags: [web, lfi, owasp-a01]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Máy quét lỗ hổng / pentest được phép (Nessus, OpenVAS, Burp của đội an ninh)"
    - "Ứng dụng nhận đường dẫn tương đối hợp lệ trong tham số"
  type: match
  suppress: 60
  group_by: [source.ip]
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - field: url.decoded
        op: regex
        value: ["\\.\\./\\.\\./", "\\.\\.\\\\\\.\\.\\\\", "/etc/(passwd|shadow|hosts)", "c:\\\\windows\\\\win\\.ini", "php://(filter|input)", "file://", "/proc/self/environ"]

- id: WEB-004
  title: Command Injection / RCE qua Web
  # Trước 13/10/2026 vế `[;|`&]\s*(...|id|cat|ls|sh|...)\b` khớp cả URL bình thường `?page=2&id=5`, `?lang=vi&cat=3`
  # (`&` là dấu tách tham số) -> alert critical và SOAR tự chặn IP người dùng thật. Giờ tên lệnh đứng ngay sau dấu tách
  # mà theo sau là `=` (tên tham số) thì không tính; `;id`, `|id`, `&&whoami`, `&cat /etc/passwd` vẫn khớp.
  severity: critical
  mitre: {tactic: Execution, technique: [T1059, T1190]}
  tags: [web, rce]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Máy quét lỗ hổng / pentest được phép (Nessus, OpenVAS, Burp của đội an ninh)"
    - "Ô tìm kiếm chứa từ như cat, ls sau dấu ; hoặc |"
    - "Trang tài liệu có chuỗi cmd.exe trong URL"
  type: match
  suppress: 60
  group_by: [source.ip]
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - field: url.decoded
        op: regex
        value: ["[;|`&]\\s*(cat|ls|id|whoami|uname|wget|curl|nc|bash|sh|powershell|cmd)\\b(?!\\s*=)", "\\$\\((id|whoami|cat|curl|wget)", "\\$\\{jndi:", "cmd\\.exe", "/bin/(ba)?sh"]

- id: WEB-005
  title: Công cụ quét lỗ hổng Web
  description: User-Agent của các công cụ tấn công/quét tự động
  severity: medium
  mitre: {tactic: Reconnaissance, technique: [T1595.002]}
  tags: [web, scanner]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Máy quét lỗ hổng của đội an ninh chạy theo lịch (nên ghi IP vào ngoại lệ)"
  type: match
  suppress: 300
  group_by: [source.ip]
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - field: user_agent.original
        op: regex
        value: "(sqlmap|nikto|nmap|masscan|gobuster|dirbuster|dirb|wfuzz|ffuf|wpscan|acunetix|nessus|openvas|zgrab|hydra|nuclei|burp)"

- id: WEB-006
  title: Dò quét thư mục (Directory brute-force)
  description: Một IP nhận >= 30 phản hồi 404 trong 60 giây
  severity: medium
  mitre: {tactic: Discovery, technique: [T1083, T1595.003]}
  tags: [web, dirbusting]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Crawler của công cụ tìm kiếm gặp nhiều liên kết chết"
    - "Giám sát uptime / kiểm thử tự động gọi URL không tồn tại"
  type: threshold
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - {field: http.response.status_code, op: eq, value: 404}
  threshold: {count: 30, window: 60, group_by: [source.ip]}

- id: WEB-007
  title: Brute-force form đăng nhập Web
  severity: high
  mitre: {tactic: Credential Access, technique: [T1110.001]}
  tags: [web, bruteforce]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Giám sát / kiểm thử tải tự động gửi form đăng nhập"
    - "Nhiều người dùng sau cùng một NAT / proxy / RD Gateway"
  type: threshold
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - {field: http.request.method, op: eq, value: POST}
      - {field: url.path, op: regex, value: "(login|signin|wp-login|auth|admin)"}
  threshold: {count: 10, window: 60, group_by: [source.ip]}

- id: WEB-008
  title: Truy cập Webshell
  # Tham số lệnh phải là TÊN tham số đầy đủ (neo đầu chuỗi / sau `&`). Trước 13/10/2026 `(cmd|exec|command|c)=` không neo
  # nên `src=`, `abc=` cũng khớp: `/images/thumb.php?src=...` (timthumb của nhiều theme WordPress) thành alert critical.
  severity: critical
  mitre: {tactic: Persistence, technique: [T1505.003]}
  tags: [web, webshell]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Ứng dụng hợp lệ có file tên shell.php hoặc tham số cmd= trong thư mục upload"
  type: match
  suppress: 120
  group_by: [source.ip]
  condition:
    all:
      - {field: event.category, op: eq, value: web}
      - any:
          - {field: url.path, op: regex, value: "/(uploads?|images?|tmp|files)/[^/]+\\.(php|phtml|jsp|aspx?)$"}
          - {field: url.path, op: regex, value: "(c99|r57|b374k|wso|shell|cmd)\\.(php|jsp|aspx?)$"}
      - {field: url.query, op: regex, value: "(^|&)(cmd|exec|command|c)="}

- id: WEB-009
  title: HTTP Flood (dấu hiệu DoS)
  description: Một IP gửi >= 300 request trong 60 giây
  severity: high
  mitre: {tactic: Impact, technique: [T1498, T1499.002]}
  tags: [web, dos]
  logsource: {product: apache, category: webserver}
  owner: detection-engineering
  falsepositives:
    - "Nhiều người dùng sau cùng một NAT / proxy / RD Gateway"
    - "Crawler, giám sát hoặc kiểm thử tải được phép"
  type: threshold
  condition: {field: event.category, op: eq, value: web}
  threshold: {count: 300, window: 60, group_by: [source.ip]}
