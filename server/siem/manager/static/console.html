<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIEM/XDR Console</title>
<style>
  :root { --bg:#0f1419; --panel:#171e26; --line:#26313d; --fg:#d6dde5; --mute:#8595a6;
          --low:#4f9dde; --medium:#e0b93b; --high:#e7793a; --critical:#e2474b; --ok:#3fb27f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, Segoe UI, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  header input { background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:6px 8px; border-radius:6px; width:230px; }
  main { padding:16px 20px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .tile b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--mute); font-size:12px; }
  nav { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
  nav button { background:none; border:1px solid var(--line); color:var(--mute); padding:6px 14px; border-radius:6px; cursor:pointer; }
  nav button.on { color:var(--fg); background:var(--panel); border-color:#3a4b5d; }
  .wrap { overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; min-width:900px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mute); font-weight:500; font-size:12px; position:sticky; top:0; background:var(--panel); }
  tr:hover td { background:#1c2530; }
  .sev { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; color:#10151a; }
  .sev.low{background:var(--low)} .sev.medium{background:var(--medium)} .sev.high{background:var(--high)} .sev.critical{background:var(--critical)}
  .st { font-size:12px; color:var(--mute); }
  .st.online,.st.success{color:var(--ok)} .st.failed,.st.offline,.st.timeout{color:var(--critical)}
  .btn { background:#233040; border:1px solid #33475c; color:var(--fg); padding:3px 8px; border-radius:5px; cursor:pointer; font-size:12px; margin:1px; }
  .btn:hover { background:#2d3e52; }
  .btn.danger { border-color:#7a3336; }
  .mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; }
  .small { color:var(--mute); font-size:12px; }
  #toast { position:fixed; right:16px; bottom:16px; background:var(--panel); border:1px solid var(--line); padding:10px 14px; border-radius:8px; display:none; max-width:420px; }
  details summary { cursor:pointer; color:var(--mute); font-size:12px; }
  pre { white-space:pre-wrap; margin:6px 0 0; max-height:260px; overflow:auto; }
  .prio { font-weight:700; } .prio.P1{color:var(--critical)} .prio.P2{color:var(--high)} .prio.P3{color:var(--medium)} .prio.P4{color:var(--low)}
  .late { color:var(--critical); font-weight:600; }
  .bar { height:6px; background:var(--line); border-radius:3px; min-width:90px; margin-top:4px; }
  .bar i { display:block; height:100%; background:var(--ok); border-radius:3px; }
  .case { padding:10px 12px 14px; }
  .case h4 { margin:12px 0 4px; font-size:13px; color:var(--mute); font-weight:600; }
  .case label { display:flex; gap:8px; align-items:flex-start; padding:2px 0; cursor:pointer; }
  .case label.done span:first-of-type { color:var(--mute); text-decoration:line-through; }
  .appr { font-size:11px; color:var(--high); border:1px solid #6b4a2a; border-radius:8px; padding:0 6px; margin-left:4px; white-space:nowrap; }
  .case textarea, .case input[type=text] { background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px; font:inherit; }
  .case textarea { width:100%; min-height:54px; }
  .ok { color:var(--ok); } .bad { color:var(--critical); } .warn { color:var(--medium); }
  .aibar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-bottom:1px solid var(--line); }
  .aibar select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px; }
  .chk { font-size:12px; padding:1px 0; }
  #overlay { position:fixed; inset:0; background:rgba(8,11,15,.92); display:none; align-items:center; justify-content:center; z-index:10; }
  #overlay form { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 24px; width:340px; display:flex; flex-direction:column; gap:10px; }
  #overlay h2 { margin:0 0 4px; font-size:17px; }
  #overlay input { background:var(--bg); border:1px solid var(--line); color:var(--fg); padding:8px 10px; border-radius:6px; font:inherit; }
  #overlay button[type=submit] { background:#2f6f53; border:1px solid #3fb27f; color:#fff; padding:8px; border-radius:6px; cursor:pointer; font:inherit; }
  #overlay .msg { min-height:18px; font-size:12px; color:var(--critical); }
  #me { font-size:13px; }
  #me b { color:var(--fg); } #me .role { color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>🛡️ SIEM/XDR Console</h1>
  <span class="small" id="updated"></span>
  <span style="flex:1"></span>
  <span id="me"></span>
  <button class="btn" id="pwbtn">Đổi mật khẩu</button>
  <button class="btn" id="logout">Đăng xuất</button>
  <a class="small" href="http://localhost:3000" target="_blank" style="color:var(--mute)">Grafana ↗</a>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <nav id="tabs">
    <button data-t="alerts" class="on">Alerts</button>
    <button data-t="agents">Agents</button>
    <button data-t="actions">Response actions</button>
    <button data-t="cases">Cases</button>
    <button data-t="ai">Đề xuất AI</button>
    <button data-t="users" id="usersTab" style="display:none">Tài khoản</button>
  </nav>
  <div class="wrap"><table id="tbl"></table></div>
</main>
<div id="overlay">
  <form id="loginForm">
    <h2>Đăng nhập SOC console</h2>
    <input id="lu" autocomplete="username" placeholder="Tên đăng nhập" required>
    <input id="lp" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
    <button type="submit">Đăng nhập</button>
    <div class="msg" id="loginMsg"></div>
  </form>
  <form id="pwForm" style="display:none">
    <h2>Đổi mật khẩu</h2>
    <div class="small" id="pwNote"></div>
    <input id="pu" autocomplete="username" hidden>
    <input id="pc" type="password" autocomplete="current-password" placeholder="Mật khẩu hiện tại" required>
    <input id="pn" type="password" autocomplete="new-password" placeholder="Mật khẩu mới (tối thiểu 12 ký tự)" required>
    <input id="pn2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" required>
    <button type="submit">Đổi mật khẩu</button>
    <button type="button" class="btn" id="pwCancel">Hủy</button>
    <div class="msg" id="pwMsg"></div>
  </form>
</div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
// Đăng nhập bằng tài khoản riêng: phiên nằm trong cookie HttpOnly (JavaScript không đọc được), không lưu gì vào
// localStorage. Hết hạn sau N phút không thao tác: request tự làm mới gửi X-Auto-Refresh nên không kéo dài phiên.
let ME = null, TAB = 'alerts';
const RANK = { analyst: 1, lead: 2, admin: 3 };
const can = role => ME && RANK[ME.role] >= RANK[role];
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); TAB = b.dataset.t; refresh();
});

async function api(path, opt = {}, auto = false) {
  const headers = { 'Content-Type': 'application/json', 'X-Requested-With': 'siem-console' };
  if ((auto || AUTO) && !opt.method) headers['X-Auto-Refresh'] = '1';
  const r = await fetch(path, { ...opt, headers, credentials: 'same-origin' });
  if (r.status === 401 && !path.startsWith('/api/v1/auth/login')) { showLogin('Phiên đã hết hạn, hãy đăng nhập lại.'); throw new Error('chưa đăng nhập'); }
  const text = await r.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!r.ok) {
    const msg = (data && data.detail) ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : text;
    if (r.status === 403 && /đổi mật khẩu/.test(msg)) showPassword(true);
    throw new Error(msg || String(r.status));
  }
  return data;
}

function showLogin(msg = '') {
  ME = null; $('#me').textContent = '';
  $('#overlay').style.display = 'flex'; $('#pwForm').style.display = 'none'; $('#loginForm').style.display = 'flex';
  $('#loginMsg').textContent = msg; $('#lp').value = ''; $('#lu').focus();
}
function showPassword(forced) {
  $('#overlay').style.display = 'flex'; $('#loginForm').style.display = 'none'; $('#pwForm').style.display = 'flex';
  $('#pwNote').textContent = forced ? 'Tài khoản đang dùng mật khẩu tạm — phải đổi trước khi dùng console.' : '';
  $('#pwCancel').style.display = forced ? 'none' : ''; $('#pwMsg').textContent = '';
  ['#pc', '#pn', '#pn2'].forEach(s => $(s).value = ''); $('#pu').value = ME ? ME.username : ''; $('#pc').focus();
}
function hideOverlay() { $('#overlay').style.display = 'none'; }
function showMe() {
  $('#me').replaceChildren(el('b', {}, ME.username), el('span', { cls: 'role' }, ` · ${ME.role} · hết phiên sau ${ME.idle_minutes} phút không thao tác`));
  $('#usersTab').style.display = can('admin') ? '' : 'none';
}
async function start(me) {
  ME = me; showMe();
  if (ME.must_change) { showPassword(true); return; }
  hideOverlay(); refresh();
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  try { await start(await api('/api/v1/auth/login', { method: 'POST', body: JSON.stringify({ username: $('#lu').value.trim(), password: $('#lp').value }) })); }
  catch (err) { $('#loginMsg').textContent = err.message; $('#lp').value = ''; }
};
$('#pwForm').onsubmit = async e => {
  e.preventDefault();
  if ($('#pn').value !== $('#pn2').value) { $('#pwMsg').textContent = 'Hai lần nhập mật khẩu mới không khớp'; return; }
  try { await start(await api('/api/v1/auth/password', { method: 'POST', body: JSON.stringify({ current: $('#pc').value, new: $('#pn').value }) })); toast('Đã đổi mật khẩu'); }
  catch (err) { $('#pwMsg').textContent = err.message; }
};
$('#pwCancel').onclick = hideOverlay;
$('#pwbtn').onclick = () => showPassword(false);
$('#logout').onclick = async () => { try { await api('/api/v1/auth/logout', { method: 'POST' }); } catch (e) {} showLogin('Đã đăng xuất.'); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000); }
// Dựng DOM an toàn bằng textContent — log chứa payload tấn công (XSS) nên KHÔNG dùng innerHTML với dữ liệu.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === 'on') e.onclick = v; else if (k === 'cls') e.className = v; else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : String(k));
  return e;
}
const g = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const fmt = t => t ? new Date(t).toLocaleString('vi-VN') : '';
const btn = (label, fn, danger) => el('button', { cls: 'btn' + (danger ? ' danger' : ''), on: fn }, label);

async function act(agent_id, type, params, alert_id) {
  try { await api('/api/v1/actions', { method: 'POST', body: JSON.stringify({ agent_id, type, params, alert_id }) }); toast(`Đã gửi lệnh ${type} tới ${agent_id}`); refresh(); }
  catch (e) { toast('Lỗi: ' + e.message); }
}
async function setStatus(id, status) {
  try { await api('/api/v1/alerts/' + id, { method: 'PATCH', body: JSON.stringify({ status }) }); refresh(); }
  catch (e) { toast('Lỗi: ' + e.message); }
}
let OPEN_CASE = null;
async function updateCase(id, body) {
  try {
    await api('/api/v1/cases/' + id, { method: 'PATCH', body: JSON.stringify(body) });
    toast('Đã cập nhật case'); OPEN_CASE = id; refresh();
  } catch (e) { toast('Lỗi: ' + e.message); }
}
function caseDetail(c) {
  const box = el('div', { cls: 'case' });
  let phase = null;
  (c.tasks || []).forEach((t, i) => {
    if (t.phase !== phase) { phase = t.phase; box.append(el('h4', {}, phase)); }
    const cb = el('input', { type: 'checkbox' }); cb.checked = !!t.done;
    cb.onchange = () => updateCase(c.id, { task_index: i, task_done: cb.checked });
    box.append(el('label', { cls: t.done ? 'done' : '' }, cb, el('span', {}, t.title),
      t.approval ? el('span', { cls: 'appr' }, 'cần duyệt: ' + t.approval) : null,
      t.done ? el('span', { cls: 'small' }, ` — ${t.done_by}, ${fmt(t.done_at)}`) : null));
  });
  const note = el('textarea', { placeholder: 'Ghi chú / kết luận (bắt buộc khi đóng case)' });
  const who = el('input', { type: 'text', placeholder: 'giao cho…', value: c.assignee || '' });
  const st = s => () => updateCase(c.id, { status: s, note: note.value });
  box.append(el('h4', {}, 'Xử lý'), note,
    el('div', { style: 'margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;align-items:center' },
      who, btn('Giao', () => updateCase(c.id, { assignee: who.value.trim(), note: note.value })),
      btn('Ghi chú', () => updateCase(c.id, { note: note.value })),
      btn('Đang xử lý', st('in_progress')), btn('Đã ngăn chặn', st('contained')),
      btn('Đóng', st('closed'), true), btn('False positive', st('false_positive'))),
    el('h4', {}, 'Lịch sử'),
    el('div', { cls: 'small mono' }, (c.notes || []).slice().reverse().map(n => el('div', {}, `${fmt(n.at)} · ${n.by}: ${n.text}`))),
    el('h4', {}, 'Alert liên quan'), el('div', { cls: 'small mono' }, (c.alert_ids || []).join(', ')));
  if (OPEN_CASE === c.id) queueMicrotask(() => { const d = box.closest('details'); if (d) d.open = true; });
  return box;
}
let AI_FILTER = 'pending';
const KIND = { exception: 'Ngoại lệ (giảm cảnh báo)', new_rule: 'Rule mới' };
async function aiDo(id, action, needReason) {
  let reason = '';
  if (needReason) { reason = prompt('Lý do (bắt buộc — AI dùng lý do này để không lặp lại):') || ''; if (!reason.trim()) return; }
  try {
    const r = await api(`/api/v1/ai/proposals/${id}/${action}`, { method: 'POST', body: JSON.stringify({ reason }) });
    toast(r.status === 'approved' ? `Đã triển khai ${r.file}` : `Đã ghi nhận (${r.status}, ${r.approvals ? r.approvals.length : 0}/${r.required_approvals} duyệt)`);
    refresh();
  } catch (e) { toast('Lỗi: ' + e.message); }
}
async function aiRun() {
  try { await api('/api/v1/ai/run', { method: 'POST', body: '{}' }); toast('Đã gửi yêu cầu, AI worker sẽ chạy trong ~10 giây'); refresh(); }
  catch (e) { toast('Lỗi: ' + e.message); }
}
function aiDetail(p) {
  const v = p.validation || {};
  return el('div', { cls: 'case' },
    el('h4', {}, 'Lý do AI đưa ra'), el('div', {}, p.rationale || ''),
    el('h4', {}, 'Kiểm định tự động (độc lập với AI)'),
    ...(v.checks || []).map(c => el('div', { cls: 'chk' }, el('span', { cls: c.ok ? 'ok' : (c.blocking ? 'bad' : 'warn') }, c.ok ? '✓ ' : (c.blocking ? '✗ ' : '! ')),
      el('b', {}, c.name + ': '), c.detail)),
    el('h4', {}, 'Nội dung sẽ triển khai'), el('pre', { cls: 'mono' }, p.yaml || ''),
    el('h4', {}, 'Lịch sử'), el('div', { cls: 'small mono' }, (p.history || []).map(h => el('div', {}, `${fmt(h.at)} · ${h.by}: ${h.text}`))),
    el('div', { cls: 'small', style: 'margin-top:8px' }, `Model ${p.llm?.model || ''} · ${p.llm?.seconds ?? ''}s · ${p.llm?.prompt_tokens ?? ''}+${p.llm?.output_tokens ?? ''} token`));
}
function head(cols) { return el('thead', {}, el('tr', {}, cols.map(c => el('th', {}, c)))); }

const views = {
  async alerts() {
    const rows = await api('/api/v1/alerts?size=200');
    return [head(['Thời gian', 'Mức', 'Rule', 'Nguồn / Host', 'MITRE', 'Trạng thái', 'SOAR', 'Phản ứng']),
      el('tbody', {}, rows.map(a => {
        const ip = g(a, 'source.ip'), agent = g(a, 'agent.id'), pid = g(a, 'process.pid'), pname = g(a, 'process.name');
        const soar = (g(a, 'soar.results') || []).map(r => `${r.action}: ${r.status}${r.target ? ' ' + r.target : ''}`).join('\n');
        return el('tr', {},
          el('td', { cls: 'small' }, fmt(a['@timestamp'])),
          el('td', {}, el('span', { cls: 'sev ' + a.severity }, a.severity), el('div', { cls: 'small' }, 'risk ' + (a.risk_score ?? ''))),
          el('td', {}, el('b', {}, g(a, 'rule.id') + ' '), g(a, 'rule.name'), el('div', { cls: 'small' }, `count=${a.count}`),
             el('details', {}, el('summary', {}, 'chi tiết'), el('pre', { cls: 'mono' }, JSON.stringify({ rule: a.rule, ml: a.ml, trigger_event: a.trigger_event }, null, 2)))),
          el('td', { cls: 'mono' }, ip || '', el('div', { cls: 'small' }, [g(a, 'user.name'), g(a, 'host.name') || agent].filter(Boolean).join(' @ '))),
          el('td', { cls: 'small' }, [g(a, 'rule.mitre.tactic'), (g(a, 'rule.mitre.technique') || []).join(', ')].filter(Boolean).join(' · ')),
          el('td', { cls: 'st' }, g(a, 'alert.status')),
          el('td', { cls: 'small mono' }, soar),
          el('td', {},
            btn('Ack', () => setStatus(a._id, 'acknowledged')), btn('Đóng', () => setStatus(a._id, 'closed')),
            btn('False +', () => setStatus(a._id, 'false_positive')),
            agent && ip ? btn('Chặn IP', () => act(agent, 'block_ip', { ip }, a._id), true) : null,
            agent && (pid || pname) ? btn('Kill', () => act(agent, 'kill_process', pid ? { pid } : { name: pname }, a._id), true) : null,
            agent && !agent.startsWith('syslog-') && can('lead') ? btn('Cô lập', () => act(agent, 'isolate_host', {}, a._id), true) : null));
      }))];
  },
  async agents() {
    const rows = await api('/api/v1/agents');
    return [head(['Agent ID', 'Hostname', 'OS', 'IP', 'Phiên bản', 'Last seen', 'Trạng thái', 'Phản ứng']),
      el('tbody', {}, rows.map(a => el('tr', {},
        el('td', { cls: 'mono' }, a.agent_id), el('td', {}, a.hostname), el('td', {}, a.os), el('td', { cls: 'mono' }, a.ip),
        el('td', {}, a.version), el('td', { cls: 'small' }, fmt(a.last_seen)), el('td', { cls: 'st ' + a.status }, a.status),
        el('td', {},
          btn('Chặn IP…', () => { const ip = prompt('IP cần chặn'); if (ip) act(a.agent_id, 'block_ip', { ip }); }),
          btn('Kill…', () => { const v = prompt('PID hoặc tên tiến trình'); if (v) act(a.agent_id, 'kill_process', /^\d+$/.test(v) ? { pid: +v } : { name: v }); }),
          can('lead') ? btn('Cô lập', () => act(a.agent_id, 'isolate_host', {}), true) : null,
          can('lead') ? btn('Bỏ cô lập', () => act(a.agent_id, 'unisolate_host', {})) : null))))];
  },
  async users() {
    const rows = await api('/api/v1/users');
    const add = async () => {
      const username = (prompt('Tên đăng nhập mới (chữ thường, số, . _ -):') || '').trim().toLowerCase(); if (!username) return;
      const role = (prompt('Vai trò: analyst | lead | admin', 'analyst') || '').trim(); if (!role) return;
      const password = prompt('Mật khẩu tạm (tối thiểu 12 ký tự — người dùng phải đổi khi đăng nhập lần đầu):') || ''; if (!password) return;
      try { await api('/api/v1/users', { method: 'POST', body: JSON.stringify({ username, role, password }) }); toast('Đã tạo tài khoản ' + username); refresh(); }
      catch (e) { toast('Lỗi: ' + e.message); }
    };
    const upd = async (u, body, msg) => {
      try { await api('/api/v1/users/' + encodeURIComponent(u), { method: 'PATCH', body: JSON.stringify(body) }); toast(msg); refresh(); }
      catch (e) { toast('Lỗi: ' + e.message); }
    };
    return [head(['Tài khoản', 'Vai trò', 'Trạng thái', 'Đăng nhập gần nhất', 'Tạo lúc', '']),
      el('tbody', {}, el('tr', {}, el('td', { colspan: '6' }, btn('+ Thêm tài khoản', add),
        el('span', { cls: 'small' }, '  analyst: xử lý alert/case, chặn IP, kill · lead: thêm cô lập máy · admin: thêm quản lý tài khoản'))),
        rows.map(u => el('tr', {},
          el('td', {}, el('b', {}, u.username), u.username === ME.username ? el('span', { cls: 'small' }, ' (bạn)') : null),
          el('td', {}, u.role),
          el('td', { cls: u.disabled ? 'bad' : (u.must_change ? 'warn' : 'ok') }, u.disabled ? 'đã khóa' : (u.must_change ? 'chờ đổi mật khẩu' : 'hoạt động')),
          el('td', { cls: 'small' }, fmt(u.last_login) || '—'), el('td', { cls: 'small' }, fmt(u.created_at)),
          el('td', {},
            btn('Đổi vai trò', () => { const r = (prompt('Vai trò mới: analyst | lead | admin', u.role) || '').trim(); if (r) upd(u.username, { role: r }, 'Đã đổi vai trò'); }),
            btn('Đặt lại mật khẩu', () => { const p = prompt('Mật khẩu tạm mới (tối thiểu 12 ký tự):') || ''; if (p) upd(u.username, { password: p }, 'Đã đặt lại mật khẩu, người dùng phải đổi khi đăng nhập'); }),
            u.username === ME.username ? null : (u.disabled
              ? btn('Mở khóa', () => upd(u.username, { disabled: false }, 'Đã mở khóa'))
              : btn('Khóa', () => upd(u.username, { disabled: true }, 'Đã khóa tài khoản'), true))))))];
  },
  async actions() {
    const rows = await api('/api/v1/actions?size=200');
    return [head(['Tạo lúc', 'Agent', 'Lệnh', 'Mục tiêu', 'Nguồn', 'Trạng thái', 'Hết hạn', 'Output', '']),
      el('tbody', {}, rows.map(a => el('tr', {},
        el('td', { cls: 'small' }, fmt(a.created_at)), el('td', { cls: 'mono' }, a.agent_id), el('td', {}, a.type),
        el('td', { cls: 'mono' }, a.target), el('td', {}, a.source), el('td', { cls: 'st ' + a.status }, a.status + (a.reverted ? ' (đã gỡ)' : '')),
        el('td', { cls: 'small' }, fmt(a.expires_at)), el('td', { cls: 'mono small' }, (a.output || '').slice(0, 300)),
        el('td', {}, a.type === 'block_ip' && a.status === 'success' && !a.reverted ? btn('Gỡ chặn', () => act(a.agent_id, 'unblock_ip', { ip: a.target })) : null))))];
  },
  async ai() {
    const [st, rows] = await Promise.all([api('/api/v1/ai/status'), api('/api/v1/ai/proposals?size=200' + (AI_FILTER ? '&status=' + AI_FILTER : ''))]);
    const w = st.worker || {};
    const sel = el('select', {}, ...['pending', 'approved', 'invalid', 'rejected', 'rolled_back', 'no_action', ''].map(x => {
      const o = el('option', { value: x }, x || 'tất cả'); if (x === AI_FILTER) o.selected = true; return o; }));
    sel.onchange = () => { AI_FILTER = sel.value; refresh(); };
    const bar = el('tr', {}, el('td', { colspan: '9', style: 'padding:0' }, el('div', { cls: 'aibar' },
      btn('Chạy phân tích AI ngay', aiRun), el('span', { cls: 'small' }, 'Lọc:'), sel,
      el('span', { cls: 'small' }, w.model ? `Worker: ${w.model} · ${w.model_ready ? 'sẵn sàng' : 'đang tải model'} · ${w.running ? 'ĐANG CHẠY' : 'rảnh'} · lần chạy cuối ${fmt(w.last_run) || '—'}` : 'AI worker chưa chạy (docker compose --profile ai up -d)'),
      w.datasets ? el('span', { cls: 'small' }, `Dataset: ${w.datasets.attack} mẫu tấn công, ${w.datasets.normal} bình thường, ${w.datasets.sigma} rule Sigma`) : null,
      w.last_error ? el('span', { cls: 'bad small' }, 'Lỗi: ' + w.last_error) : null)));
    return [head(['Tạo lúc', 'Loại', 'Đề xuất', 'Rủi ro', 'Kiểm định', 'Số liệu', 'Duyệt', 'Trạng thái', '']),
      el('tbody', {}, bar, ...rows.flatMap(p => {
        const v = p.validation || {}, m = v.metrics || {};
        const nums = p.kind === 'exception'
          ? `báo nhầm khớp ${m.fp_matched ?? '?'}/${m.fp_total ?? '?'} · case thật khớp ${m.tp_matched ?? 0}/${m.tp_total ?? 0} · mẫu vàng mất ${m.golden_matched ?? 0}/${m.golden_total ?? 0} · replay ${m.alerts_before ?? '?'}→${m.alerts_after ?? '?'} alert`
          : `bắt ${m.test_detected ?? '?'}/${m.test_total ?? '?'} mẫu kiểm tra · báo nhầm ${m.normal_hits ?? '—'}/${m.normal_total ?? '—'} · ~${m.alerts_per_day ?? '?'} alert/ngày`;
        const row = el('tr', {},
          el('td', { cls: 'small' }, fmt(p.created_at)),
          el('td', { cls: 'small' }, KIND[p.kind] || p.kind),
          el('td', {}, p.title, el('div', { cls: 'small' }, (p.rationale || '').slice(0, 160))),
          el('td', { cls: p.risk === 'cao' ? 'bad' : 'small' }, p.risk || ''),
          el('td', { cls: v.passed ? 'ok' : 'bad' }, p.validation ? (v.passed ? 'đạt' : 'KHÔNG đạt') : '—'),
          el('td', { cls: 'small' }, p.validation ? nums : ''),
          el('td', { cls: 'small' }, p.required_approvals ? `${(p.approvals || []).length}/${p.required_approvals}` : '—',
             el('div', {}, (p.approvals || []).map(a => a.by).join(', '))),
          el('td', { cls: 'st' }, p.status),
          el('td', {},
            p.status === 'pending' ? btn('Duyệt', () => aiDo(p.id, 'approve')) : null,
            ['pending', 'invalid'].includes(p.status) ? btn('Từ chối', () => aiDo(p.id, 'reject', true)) : null,
            p.status === 'approved' ? btn('Gỡ', () => aiDo(p.id, 'rollback', true), true) : null));
        return [row, el('tr', {}, el('td', { colspan: '9', style: 'padding:0' },
          el('details', {}, el('summary', { style: 'padding:4px 12px' }, 'chi tiết kiểm định, nội dung, lịch sử'), aiDetail(p))))];
      }))];
  },
  async cases() {
    const rows = await api('/api/v1/cases');
    const now = Date.now();
    return [head(['Tạo lúc', 'Ưu tiên', 'Case', 'Playbook', 'Thực thể', 'Alert', 'Người xử lý', 'Hạn triage', 'Tiến độ', 'Trạng thái']),
      el('tbody', {}, rows.flatMap(c => {
        const tasks = c.tasks || [], done = tasks.filter(t => t.done).length;
        const late = c.status === 'open' && c.sla_due && new Date(c.sla_due).getTime() < now;
        const row = el('tr', {},
          el('td', { cls: 'small' }, fmt(c.created_at)),
          el('td', { cls: 'prio ' + (c.priority || '') }, c.priority || ''),
          el('td', {}, c.title, el('div', {}, el('span', { cls: 'sev ' + c.severity }, c.severity))),
          el('td', { cls: 'small' }, c.playbook ? `${c.playbook.id} — ${c.playbook.name}` : ''),
          el('td', { cls: 'mono' }, c.entity),
          el('td', {}, c.alert_count),
          el('td', {}, c.assignee || el('span', { cls: 'small' }, 'chưa giao')),
          el('td', { cls: late ? 'late' : 'small' }, fmt(c.sla_due) + (late ? ' (QUÁ HẠN)' : '')),
          el('td', { cls: 'small' }, `${done}/${tasks.length}`,
             el('div', { cls: 'bar' }, el('i', { style: `width:${tasks.length ? 100 * done / tasks.length : 0}%` }))),
          el('td', { cls: 'st' }, c.status));
        const detail = el('tr', {}, el('td', { colspan: '10', style: 'padding:0' },
          el('details', {}, el('summary', { style: 'padding:4px 12px' }, 'mở case: checklist, xử lý, lịch sử'), caseDetail(c))));
        return [row, detail];
      }))];
  },
};

let AUTO = false;   // đang làm mới tự động -> mọi GET gắn X-Auto-Refresh (không tính là thao tác của người dùng)
async function refresh(auto = false) {
  if (!ME || ME.must_change) return;
  AUTO = auto;
  try {
    const s = await api('/api/v1/stats', {}, auto);
    const labels = { events_24h: 'Event 24h', alerts_24h: 'Alert 24h', alerts_open: 'Alert đang mở', agents_online: 'Agent online', agents_total: 'Tổng agent', actions_pending: 'Lệnh đang chờ', cases_open: 'Case đang mở' };
    $('#tiles').replaceChildren(...Object.entries(labels).map(([k, l]) => el('div', { cls: 'tile' }, el('b', {}, (s[k] ?? 0).toLocaleString('vi-VN')), el('span', {}, l))));
    if (TAB === 'users' && !can('admin')) TAB = 'alerts';
    $('#tbl').replaceChildren(...await views[TAB]());
    $('#updated').textContent = 'cập nhật ' + new Date().toLocaleTimeString('vi-VN');
  } catch (e) { $('#updated').textContent = 'Lỗi: ' + e.message; }
  finally { AUTO = false; }
}
(async () => {
  try { await start(await api('/api/v1/auth/me')); } catch (e) { if (!ME) showLogin(''); }
})();
setInterval(() => { if (ME && !document.querySelector('details[open]')) refresh(true); }, 5000);
</script>
</body>
</html>
