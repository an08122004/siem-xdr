<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%271%27 y=%271%27 width=%2714%27 height=%2714%27 rx=%273%27 fill=%27%23181b1f%27/%3E%3Crect x=%273%27 y=%2710%27 width=%272%27 height=%273%27 fill=%27%234f9dde%27/%3E%3Crect x=%276%27 y=%277%27 width=%272%27 height=%276%27 fill=%27%23e0b93b%27/%3E%3Crect x=%279%27 y=%275%27 width=%272%27 height=%278%27 fill=%27%23e7793a%27/%3E%3Crect x=%2712%27 y=%273%27 width=%272%27 height=%2710%27 fill=%27%23e2474b%27/%3E%3C/svg%3E">
<title>SIEM/XDR</title>
<style>
  /* Một hệ thống chung: SOC console là khung, dashboard Grafana (cùng tài khoản, cùng phiên) nhúng vào trang Tổng quan
     và Điều tra. Màu nền theo Grafana dark để dashboard nhúng liền mạch; màu chỉ dùng cho mức độ cảnh báo. */
  :root {
    color-scheme: dark;
    --bg: #111217; --surface: #181b1f; --raised: #1f2329; --line: #2b3038; --line2: #3a404a;
    --fg: #d8dce3; --mute: #8e95a3; --faint: #6b7280;
    --low: #4f9dde; --medium: #e0b93b; --high: #e7793a; --critical: #e2474b; --ok: #3fb27f;
    --accent: #4f9dde;
    --display: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", sans-serif;
    --text: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Noto Sans", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --rail: 216px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--text); overflow: hidden; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  [hidden] { display: none !important; }
  .num { font-family: var(--display); font-variant-numeric: tabular-nums; }

  /* ---------- khung */
  .app { display: grid; grid-template-columns: var(--rail) 1fr; height: 100vh; }
  .rail { position: relative; display: flex; flex-direction: column; background: var(--surface);
          border-right: 1px solid var(--line); padding: 18px 0 12px 6px; min-height: 0; }
  .spectrum { position: absolute; inset: 0 auto 0 0; width: 4px; display: flex; flex-direction: column-reverse; }
  .spectrum i { flex: 1; }
  .spectrum .s1 { background: var(--low); } .spectrum .s2 { background: var(--medium); }
  .spectrum .s3 { background: var(--high); } .spectrum .s4 { background: var(--critical); }
  .brand { margin: 0 16px 18px; font: 600 26px/1 var(--display); font-stretch: 85%; letter-spacing: .01em; }
  .brand small { display: block; margin-top: 6px; font: 12px var(--text); color: var(--mute); letter-spacing: 0; }
  .nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 12px; margin-right: 8px;
           color: var(--mute); text-decoration: none; border-radius: 0 6px 6px 0; border-left: 2px solid transparent; }
  .nav a:hover { color: var(--fg); background: var(--raised); }
  .nav a[aria-current="page"] { color: var(--fg); background: var(--raised); border-left-color: var(--accent); }
  .nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6;
             stroke-linecap: round; stroke-linejoin: round; }
  .nav .count { margin-left: auto; font: 13px var(--display); font-variant-numeric: tabular-nums; color: var(--mute); }
  .nav .count.hot { color: var(--critical); }
  .nav .sep { height: 1px; background: var(--line); margin: 8px 14px 8px 12px; }
  .me { margin-top: auto; padding: 12px 14px 0 12px; border-top: 1px solid var(--line); font-size: 13px; }
  .me b { display: block; font-weight: 600; }
  .me .role { color: var(--mute); }
  .me .links { display: flex; gap: 12px; margin-top: 8px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--mute); cursor: pointer; font-size: 13px; }
  .linkbtn:hover { color: var(--fg); text-decoration: underline; }
  .me .idle { margin-top: 6px; color: var(--faint); font-size: 12px; }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 20px;
         border-bottom: 1px solid var(--line); min-height: 58px; }
  .bar h1 { margin: 0 6px 0 0; font: 600 21px/1.1 var(--display); letter-spacing: .01em; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; }
  .sync { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
  .sync.bad { color: var(--critical); }
  .content { flex: 1; overflow: auto; min-height: 0; }
  .frame { flex: 1; min-height: 0; display: flex; }
  .frame iframe { flex: 1; border: 0; background: var(--bg); }

  /* ---------- điều khiển */
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; border-right: 1px solid var(--line2); padding: 5px 11px; color: var(--mute);
                cursor: pointer; font-size: 13px; white-space: nowrap; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--fg); background: var(--raised); }
  .seg button[aria-pressed="true"] { color: var(--fg); background: var(--raised); box-shadow: inset 0 -2px 0 var(--accent); }
  .chip { background: none; border: 1px solid var(--line2); border-radius: 999px; padding: 3px 10px; color: var(--mute);
          cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] { color: var(--fg); border-color: currentColor; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  input.field, select.field, textarea.field { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px;
          padding: 6px 9px; min-width: 0; }
  input.field:hover, select.field:hover, textarea.field:hover { border-color: #4a515c; }
  input.search { width: 260px; }
  textarea.field { width: 100%; min-height: 64px; resize: vertical; }
  .btn { background: var(--raised); border: 1px solid var(--line2); color: var(--fg); padding: 5px 11px; border-radius: 6px;
         cursor: pointer; font-size: 13px; white-space: nowrap; text-decoration: none; display: inline-block; line-height: 1.45; }
  .btn:hover { border-color: #565e6b; background: #262b32; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #07121c; font-weight: 600; }
  .btn.primary:hover { background: #69ace4; }
  .btn.danger { border-color: #6f3335; color: #ffb1b3; }
  .btn.danger:hover { background: #3a1f22; }
  .btn.armed { background: var(--critical); border-color: var(--critical); color: #fff; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- bảng */
  table.list { border-collapse: separate; border-spacing: 0; width: 100%; }
  .list th { position: sticky; top: 0; z-index: 1; background: var(--bg); text-align: left; font-weight: 500; font-size: 12px;
             color: var(--mute); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .list td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .list th:first-child, .list td:first-child { padding-left: 20px; }
  .list tr.row { cursor: pointer; }
  .list tr.row:hover td { background: var(--surface); }
  .list tr.row[aria-selected="true"] td { background: var(--raised); }
  .list tr.row td:first-child { box-shadow: inset 3px 0 0 var(--edge, transparent); }
  .edge-low { --edge: var(--low); } .edge-medium { --edge: var(--medium); }
  .edge-high { --edge: var(--high); } .edge-critical { --edge: var(--critical); }
  .when { white-space: nowrap; color: var(--mute); font-size: 13px; }
  .title { font-weight: 600; }
  .sub { color: var(--mute); font-size: 12px; }
  .mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  .sev { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  .sev i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
  .sev.low { --c: var(--low); } .sev.medium { --c: var(--medium); } .sev.high { --c: var(--high); } .sev.critical { --c: var(--critical); }
  .st { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line2);
        color: var(--mute); white-space: nowrap; }
  .st.new { color: #ffb1b3; border-color: #6f3335; }
  .st.work { color: #ffd38a; border-color: #6b5326; }
  .st.done { color: #9fdcbf; border-color: #2c5a45; }
  .st.bad { color: #ffb1b3; border-color: #6f3335; }
  .soar { font-size: 12px; color: var(--mute); }
  .soar span { display: block; white-space: nowrap; }
  .ok { color: var(--ok); } .bad { color: var(--critical); } .warn { color: var(--medium); }
  .prio { font: 600 14px var(--display); }
  .prio.P1 { color: var(--critical); } .prio.P2 { color: var(--high); } .prio.P3 { color: var(--medium); } .prio.P4 { color: var(--low); }
  .progress { height: 4px; background: var(--line); border-radius: 2px; margin-top: 5px; min-width: 70px; }
  .progress i { display: block; height: 100%; background: var(--ok); border-radius: 2px; }
  .empty { padding: 48px 20px; color: var(--mute); max-width: 52ch; }
  .empty b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; }
  .notice { margin: 12px 20px 0; padding: 9px 12px; border-left: 3px solid var(--critical); background: var(--surface); }
  .inline-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0 2px; }

  /* ---------- ngăn chi tiết */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--surface);
            border-left: 1px solid var(--line2); box-shadow: -18px 0 40px rgba(0, 0, 0, .35); z-index: 20;
            display: flex; flex-direction: column; animation: slide .16s ease-out; }
  @keyframes slide { from { transform: translateX(28px); } to { transform: none; } }
  .drawer > header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line);
                     box-shadow: inset 0 3px 0 var(--edge, var(--line2)); }
  .drawer .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 22px; line-height: 1;
               cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .drawer .x:hover { color: var(--fg); background: var(--raised); }
  .drawer .body { overflow: auto; padding: 4px 18px 28px; }
  .drawer h2 { margin: 12px 0 4px; font-size: 18px; line-height: 1.3; }
  .drawer h3 { margin: 20px 0 8px; font-size: 13px; font-weight: 600; color: var(--mute); }
  .desc { color: var(--mute); margin: 0 0 6px; }
  .facts { display: grid; grid-template-columns: 9.5em 1fr; gap: 5px 12px; margin: 10px 0 0; font-size: 13px; }
  .facts dt { color: var(--mute); }
  .facts dd { margin: 0; word-break: break-word; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .items li { padding: 7px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .items li.link { cursor: pointer; } .items li.link:hover { border-color: var(--line2); }
  .hist { list-style: none; margin: 0; padding: 0; font-size: 13px; display: grid; gap: 5px; }
  .hist li { padding-left: 12px; border-left: 2px solid var(--line2); }
  .hist .sub { display: block; }
  details.raw summary { cursor: pointer; color: var(--mute); font-size: 13px; }
  pre { white-space: pre-wrap; margin: 8px 0 0; max-height: 340px; overflow: auto; background: var(--bg); padding: 10px;
        border: 1px solid var(--line); border-radius: 6px; font: 12px/1.5 var(--mono); }
  .phase { margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
  .task { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; cursor: pointer; font-size: 13.5px; }
  .task input { margin-top: 3px; }
  .task.done > span:first-of-type { color: var(--mute); text-decoration: line-through; }
  .appr { font-size: 12px; color: var(--high); white-space: nowrap; }
  .late { color: var(--critical); font-weight: 600; }

  #toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 40; max-width: min(440px, 90vw); }
  .toast { background: var(--raised); border: 1px solid var(--line2); border-left: 3px solid var(--ok); padding: 10px 14px;
           border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
  .toast.err { border-left-color: var(--critical); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    .rail { flex-direction: row; align-items: center; padding: 8px 12px 8px 14px; gap: 8px; overflow-x: auto;
            border-right: 0; border-bottom: 1px solid var(--line); }
    .spectrum { inset: 0 0 auto 0; width: auto; height: 3px; flex-direction: row; }
    .brand { margin: 0 6px 0 0; font-size: 20px; } .brand small { display: none; }
    .nav { flex-direction: row; overflow: visible; }
    .nav a { border-left: 0; border-radius: 6px; margin: 0; padding: 6px 9px; white-space: nowrap; }
    .nav a span.label { display: none; } .nav a[aria-current="page"] span.label { display: inline; }
    .nav .sep, .me .idle, .me .role { display: none; }
    .me { margin: 0 0 0 auto; border: 0; padding: 0; white-space: nowrap; } .me b { display: none; }
    .main { min-height: calc(100vh - 52px); }
    .bar { padding: 10px 14px; flex-direction: column; align-items: stretch; }
    .tools { width: 100%; } .sync { margin-left: 0; }
    .list th:first-child, .list td:first-child { padding-left: 14px; }
    table.list { table-layout: fixed; }                 /* bảng vừa màn hình: chữ xuống dòng thay vì tràn ngang */
    .list td, .list th { padding: 8px 6px; overflow-wrap: anywhere; }
    input.search, .tools input.search[style] { width: 100% !important; }
    .frame { min-height: 75vh; }
    .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Điều hướng">
    <div class="spectrum" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i></div>
    <div class="brand">SIEM/XDR<small>Trung tâm giám sát an ninh</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main class="main">
    <header class="bar">
      <h1 id="title">Tổng quan</h1>
      <div class="tools" id="tools"></div>
      <span class="sync" id="sync" role="status"></span>
    </header>
    <div class="content" id="content"></div>
    <div class="frame" id="frame-overview" hidden><iframe title="Dashboard tổng quan SOC (Grafana)"></iframe></div>
    <div class="frame" id="frame-investigate" hidden><iframe title="Dashboard điều tra thực thể (Grafana)"></iframe></div>
    <div class="frame" id="frame-rules" hidden><iframe title="Thư viện rule và so sánh với đề xuất AI (Grafana)"></iframe></div>
  </main>
</div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden></aside>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
// ============================================================================ tiện ích
const $ = (s, r = document) => r.querySelector(s);
// Dựng DOM bằng textContent — log chứa payload tấn công (XSS) nên KHÔNG dùng innerHTML với dữ liệu.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'cls') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const svgNS = 'http://www.w3.org/2000/svg';
function icon(d) {
  const s = document.createElementNS(svgNS, 'svg'); s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('aria-hidden', 'true');
  for (const p of d.split('|')) { const path = document.createElementNS(svgNS, 'path'); path.setAttribute('d', p); s.append(path); }
  return s;
}
const g = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const fmt = t => t ? new Date(t).toLocaleString('vi-VN') : '';
function ago(t) {
  if (!t) return '';
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 45) return 'vừa xong';
  if (s < 3600) return `${Math.round(s / 60)} phút trước`;
  if (s < 86400) return `${Math.round(s / 3600)} giờ trước`;
  if (s < 86400 * 30) return `${Math.round(s / 86400)} ngày trước`;
  return new Date(t).toLocaleDateString('vi-VN');
}
const when = t => el('span', { cls: 'when', title: fmt(t) }, ago(t));
const isEndpoint = id => !!id && !String(id).startsWith('syslog-');
const luceneValue = v => '"' + String(v).replace(/[\\"]/g, m => '\\' + m) + '"';
const isIP = s => /^(\d{1,3}\.){3}\d{1,3}$/.test(s) || (/^[0-9a-f:]+$/i.test(s) && s.includes(':') && s.length > 2);

const SEV = { low: 'Thấp', medium: 'Trung bình', high: 'Cao', critical: 'Nghiêm trọng' };
const ALERT_ST = { open: ['Mới', 'new'], acknowledged: ['Đã xác nhận', 'work'], in_progress: ['Đang xử lý', 'work'],
                   closed: ['Đã đóng', 'done'], false_positive: ['Báo nhầm', 'done'] };
const CASE_ST = { open: ['Mới', 'new'], in_progress: ['Đang xử lý', 'work'], contained: ['Đã ngăn chặn', 'work'],
                  closed: ['Đã đóng', 'done'], false_positive: ['Báo nhầm', 'done'] };
const ACT_ST = { pending: ['Chờ gửi', 'work'], sent: ['Đã gửi, chờ agent', 'work'], success: ['Thành công', 'done'],
                 failed: ['Thất bại', 'bad'], timeout: ['Quá hạn', 'bad'] };
const ACT_TYPE = { block_ip: 'Chặn IP', unblock_ip: 'Gỡ chặn IP', kill_process: 'Kill tiến trình', isolate_host: 'Cô lập máy',
                   unisolate_host: 'Bỏ cô lập' };
const SOAR_ST = { queued: 'đã gửi lệnh', skipped: 'bỏ qua', created: 'tạo case mới', updated: 'gom vào case', logged: 'đã ghi log',
                  sent: 'đã gửi', awaiting_approval: 'chờ duyệt', error: 'lỗi' };
const ACTION_LABEL = { notify: 'Thông báo', create_case: 'Case', block_ip: 'Chặn IP', kill_process: 'Kill', isolate_host: 'Cô lập' };
const RESPONSE = ['block_ip', 'kill_process', 'isolate_host'];
const sev = s => el('span', { cls: 'sev ' + (s || '') }, el('i'), SEV[s] || s || '');
const stLabel = (map, s) => { const [label, kind] = map[s] || [s || '—', '']; return el('span', { cls: 'st ' + kind }, label); };

// ============================================================================ API
let ME = null, LEAVING = false;
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
async function api(path, { method = 'GET', body, auto = false } = {}) {
  const headers = { 'X-Requested-With': 'siem-console' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (auto && method === 'GET') headers['X-Auto-Refresh'] = '1';   // làm mới tự động: không tính là thao tác
  const r = await fetch(path, { method, headers, credentials: 'same-origin', body: body === undefined ? undefined : JSON.stringify(body) });
  // đang đăng xuất: request còn dở nhận 401 là đương nhiên, không báo "phiên hết hạn"
  if (r.status === 401) { if (!LEAVING) toLogin('expired'); throw new ApiError('Phiên đăng nhập đã hết hạn.', 401); }
  const text = await r.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!r.ok) {
    let msg = data && data.detail;
    if (Array.isArray(msg)) msg = 'Dữ liệu không hợp lệ: ' + msg.map(d => (d.loc || []).slice(-1)[0] + ' ' + d.msg).join('; ');
    msg = msg || text || `Lỗi ${r.status}`;
    if (r.status === 403 && /đổi mật khẩu/.test(msg)) toLogin('', true);
    throw new ApiError(String(msg), r.status);
  }
  return data;
}
const sentence = s => { s = String(s || '').trim(); return s ? s[0].toUpperCase() + s.slice(1) + (/[.!?]$/.test(s) ? '' : '.') : ''; };
function toLogin(reason, change) {
  location.replace('/login?' + (change ? 'change=1&' : '') + (reason ? 'reason=' + reason + '&' : '') +
                   'next=' + encodeURIComponent(location.pathname + location.search + location.hash));
}
function toast(msg, err) {
  const t = el('div', { cls: 'toast' + (err ? ' err' : ''), role: err ? 'alert' : 'status' }, msg);
  $('#toasts').append(t); setTimeout(() => t.remove(), err ? 7000 : 4000);
}
// nút làm việc: khóa trong lúc chờ, báo lỗi bằng toast
async function run(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg); return r; }
  catch (e) { if (e.code !== 401) toast(sentence(e.message), true); }
  finally { if (btn) btn.disabled = false; }
}

// lệnh nặng (chặn, kill, cô lập, khóa tài khoản): bấm lần 1 để hiện câu hỏi, bấm lần 2 trong 4 giây mới thực hiện
function confirmButton(label, question, fn) {
  const b = el('button', { type: 'button', cls: 'btn danger' }, label);
  let armed = null;
  const reset = () => { clearTimeout(armed); armed = null; b.textContent = label; b.classList.remove('armed'); };
  b.addEventListener('click', async () => {
    if (!armed) { b.textContent = question; b.classList.add('armed'); armed = setTimeout(reset, 4000); return; }
    reset(); await fn(b);
  });
  b.addEventListener('blur', () => armed && reset());
  return b;
}

function grafanaUrl(uid, from, vars = {}, { showVars = false } = {}) {
  const p = new URLSearchParams({ orgId: '1', from, to: 'now', refresh: '30s', theme: 'dark' });
  for (const [k, v] of Object.entries(vars)) p.set('var-' + k, v);
  // kiosk: bỏ thanh điều hướng Grafana; ẩn bộ chọn thời gian / biến của Grafana vì console đã có điều khiển riêng

  return `/grafana/d/${uid}?${p}&kiosk&_dash.hideTimePicker${showVars ? '' : '&_dash.hideVariables'}&_dash.hideLinks`;
}
// Grafana cùng origin với console: bắt cú bấm vào liên kết "Mở trên SOC console" trong khung để mở chi tiết ngay tại chỗ

function hookFrame(iframe) {
  iframe.addEventListener('load', () => {
    let w; try { w = iframe.contentWindow; void w.document; } catch (e) { return; }
    w.addEventListener('click', e => {
      const a = e.target && e.target.closest && e.target.closest('a[href]');
      const m = a && /\/go\/(alert|case|proposal|rule)\/([A-Za-z0-9_.-]+)/.exec(a.getAttribute('href') || '');
      if (!m) return;
      e.preventDefault(); e.stopImmediatePropagation();
      go({ alert: `#/alerts/${m[2]}`, case: `#/cases/${m[2]}`, proposal: `#/ai/${m[2]}`,
           rule: `#/alerts?set=all&since=30d&q=${encodeURIComponent(m[2])}` }[m[1]]);
    }, true);
  });
}
function showFrame(name, url) {
  for (const f of document.querySelectorAll('.frame')) f.hidden = f.id !== 'frame-' + name;
  $('#content').hidden = true;
  const iframe = $(`#frame-${name} iframe`);
  if (iframe.dataset.src !== url) { iframe.dataset.src = url; iframe.src = url; }   // giữ khung đã tải khi chuyển trang
}

function paint(view, rows, build, auto) {
  const sig = JSON.stringify(rows), c = $('#content');
  // làm mới tự động: bỏ qua nếu dữ liệu không đổi, hoặc người dùng đang gõ trong form trên trang (không xóa chữ đang nhập)

  listState[view] = sig;
  const top = c.scrollTop, focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#content tr.row');
  c.replaceChildren(...[].concat(build(rows)));

function entityQuery(t) {
  t = (t || '').trim();
  if (!t || t === '*') return '*';
  if (isIP(t)) return `source.ip:${luceneValue(t)} OR destination.ip:${luceneValue(t)}`;
  if (/[:*()]|\s(AND|OR|NOT)\s/.test(t)) return t;                 // đã là truy vấn Lucene
  return `host.name:${luceneValue(t)} OR user.name:${luceneValue(t)} OR agent.name:${luceneValue(t)}`;
}

        ['Thời điểm', fmt(a['@timestamp'])], ['Risk', a.risk_score != null ? el('span', { cls: 'num' }, a.risk_score) : null],
        ['Số event', a.count > 1 ? a.count : null], ['Phát hiện bởi', { rule: 'Rule siem-xdr', ml: 'Học máy', wazuh: 'Ruleset Wazuh' }[g(a, 'alert.source')] || g(a, 'alert.source')],
        ['IP nguồn', ip ? el('span', { cls: 'mono' }, ip, g(a, 'source.port') ? ':' + g(a, 'source.port') : '') : null],
        ['IP đích', g(a, 'destination.ip') ? el('span', { cls: 'mono' }, g(a, 'destination.ip')) : null],
        ['Máy', [g(a, 'host.name'), agent ? `(agent ${agent})` : ''].filter(Boolean).join(' ')],
        ['Tài sản', g(a, 'asset.id') ? `${g(a, 'asset.id')}, mức quan trọng ${g(a, 'asset.criticality') || '?'}` : null],
        ['Tài khoản', g(a, 'user.name')], ['Tiến trình', pid || g(a, 'process.name') ? `${g(a, 'process.name') || ''} ${pid ? 'PID ' + pid : ''}`.trim() : null],
        ['Dòng lệnh', g(a, 'process.command_line') ? el('span', { cls: 'mono' }, g(a, 'process.command_line')) : null],
        ['URL', g(a, 'url.original') ? el('span', { cls: 'mono' }, g(a, 'url.original')) : null],
        ['File', g(a, 'file.path') ? el('span', { cls: 'mono' }, g(a, 'file.path')) : null],
        ['MITRE ATT&CK', mitre],
      ]),
      el('h3', {}, 'Xử lý'), note,
      el('div', { cls: 'btns', style: 'margin-top:8px' },
        button('Xác nhận', b => setSt(b, 'acknowledged')), button('Đang xử lý', b => setSt(b, 'in_progress')),
        button('Đóng', b => setSt(b, 'closed'), 'primary'), button('Báo nhầm', b => setSt(b, 'false_positive'))),
      el('h3', {}, 'Phản ứng'),
      resp.length ? el('div', { cls: 'btns' }, resp) : el('p', { cls: 'sub' }, isEndpoint(agent)
        ? 'Không có IP hoặc PID trong cảnh báo để phản ứng tự động; dùng trang Agent để chặn IP hay kill theo tên.'
        : 'Cảnh báo đến từ log syslog (firewall, Suricata), không có agent để chạy lệnh trên máy.'),
      el('div', { cls: 'btns', style: 'margin-top:8px' }, investigateLinks(a)),
      (a.actions || []).length ? el('ul', { cls: 'items', style: 'margin-top:10px' }, a.actions.map(x => el('li', {},
        el('b', {}, ACT_TYPE[x.type] || x.type), ' ', el('span', { cls: 'mono' }, x.target), ' ', stLabel(ACT_ST, x.status),
        el('div', { cls: 'sub' }, `${x.requested_by || 'SOAR'}, ${fmt(x.created_at)}`, x.output ? ` — ${x.output}` : '')))) : null,
      el('h3', {}, 'SOAR đã làm'),
      (g(a, 'soar.results') || []).length ? el('ul', { cls: 'items' }, g(a, 'soar.results').map(r => el('li', {},
        el('b', {}, ACTION_LABEL[r.action] || r.action), `: ${SOAR_ST[r.status] || r.status}`,
        r.target ? el('span', { cls: 'mono' }, ' ' + r.target) : null, r.detail ? el('div', { cls: 'sub' }, r.detail) : null,
        el('div', { cls: 'sub' }, `playbook ${r.playbook}`))))
        : el('p', { cls: 'sub' }, 'Không khớp playbook tự động nào.'),
      el('h3', {}, 'Case'),
      (a.cases || []).length ? el('ul', { cls: 'items' }, a.cases.map(c => el('li', { cls: 'link', tabindex: '0',
        onClick: () => go('#/cases/' + c._id), onKeydown: e => { if (e.key === 'Enter') go('#/cases/' + c._id); } },
        el('b', {}, c.title), ' ', stLabel(CASE_ST, c.status))))
        : el('p', { cls: 'sub' }, 'Cảnh báo chưa nằm trong case nào.'),
      el('h3', {}, 'Lịch sử xử lý'), hist(g(a, 'alert.history') || []),
      el('h3', {}, 'Sự kiện gốc'),
      facts([['Loại', [g(te, 'event.category'), g(te, 'event.action'), g(te, 'event.outcome')].filter(Boolean).join(', ')],
             ['Nguồn log', g(te, 'event.module') || g(te, 'event.dataset')], ['Thông điệp', g(te, 'message')],
             ['HTTP', g(te, 'http.request.method') ? `${g(te, 'http.request.method')} ${g(te, 'http.response.status_code') || ''}` : null]]),
      el('details', { cls: 'raw', style: 'margin-top:10px' }, el('summary', {}, 'Toàn bộ dữ liệu (JSON)'),
        el('pre', {}, JSON.stringify({ rule: a.rule, ml: a.ml, wazuh: a.wazuh, trigger_event: te }, null, 2)))),
  ];
}

function caseDrawer(c) {
  const tasks = c.tasks || [], done = tasks.filter(t => t.done).length;
  const note = el('textarea', { cls: 'field', placeholder: 'Ghi chú / kết luận (bắt buộc khi đóng case hoặc báo nhầm)' });
  const who = el('input', { cls: 'field', type: 'text', value: c.assignee || '', placeholder: 'tài khoản xử lý', 'aria-label': 'Giao cho', style: 'width:180px' });
  const upd = (b, body, msg) => run(b, () => api('/api/v1/cases/' + encodeURIComponent(c._id), { method: 'PATCH', body }), msg)
    .then(r => { if (r) { note.value = ''; delete note.dataset.dirty; delete who.dataset.dirty; refreshNow(); } });
  const st = (b, s) => upd(b, { status: s, note: note.value }, `Đã chuyển case sang “${CASE_ST[s][0]}”.`);
  const late = c.status === 'open' && c.sla_due && new Date(c.sla_due).getTime() < Date.now();
  let phase = null;
  const checklist = [];
  tasks.forEach((t, i) => {
    if (t.phase !== phase) { phase = t.phase; checklist.push(el('div', { cls: 'phase' }, phase)); }
    const cb = el('input', { type: 'checkbox' }); cb.checked = !!t.done;
    cb.addEventListener('change', () => upd(cb, { task_index: i, task_done: cb.checked }, cb.checked ? 'Đã đánh dấu hoàn thành.' : 'Đã bỏ đánh dấu.'));
    checklist.push(el('label', { cls: 'task' + (t.done ? ' done' : '') }, cb, el('span', {}, t.title),
      t.approval ? el('span', { cls: 'appr' }, 'cần ' + t.approval + ' duyệt') : null,
      t.done ? el('span', { cls: 'sub' }, `${t.done_by}, ${fmt(t.done_at)}`) : null));
  });
  return [
    el('header', {}, el('span', { cls: 'prio ' + (c.priority || '') }, c.priority || ''), sev(c.severity), stLabel(CASE_ST, c.status), closeX()),
    el('div', { cls: 'body' },
      el('h2', { id: 'drawer-title', tabindex: '-1' }, c.title),
      facts([['Playbook', c.playbook ? `${c.playbook.id} ${c.playbook.name}` : null], ['Thực thể', el('span', { cls: 'mono' }, c.entity)],
             ['Máy', c.host], ['Mở lúc', fmt(c.created_at)],
             ['Hạn triage', c.sla_due ? el('span', { cls: late ? 'late' : '' }, fmt(c.sla_due) + (late ? ', quá hạn' : '')) : null],
             ['Người xử lý', c.assignee || 'chưa giao'], ['Số alert', c.alert_count]]),
      el('div', { cls: 'btns', style: 'margin-top:10px' }, el('a', { cls: 'btn', href: '#/investigate?q=' + encodeURIComponent(entityQuery(c.entity)) }, 'Điều tra ' + c.entity)),
      el('h3', {}, `Checklist xử lý (${done}/${tasks.length})`),
      el('div', { cls: 'progress' }, el('i', { style: `width:${tasks.length ? 100 * done / tasks.length : 0}%` })),
      checklist,
      el('h3', {}, 'Xử lý'), note,
      el('div', { cls: 'inline-form', style: 'margin-top:6px' }, who, button('Giao', b => upd(b, { assignee: who.value.trim(), note: note.value }, 'Đã giao case.')),
        button('Lưu ghi chú', b => note.value.trim() ? upd(b, { note: note.value }, 'Đã lưu ghi chú.') : note.focus())),
      el('div', { cls: 'btns', style: 'margin-top:6px' },
        button('Đang xử lý', b => st(b, 'in_progress')), button('Đã ngăn chặn', b => st(b, 'contained')),
        button('Đóng case', b => note.value.trim() ? st(b, 'closed') : (toast('Ghi kết luận vào ô ghi chú trước khi đóng case.', true), note.focus()), 'primary'),
        button('Báo nhầm', b => note.value.trim() ? st(b, 'false_positive') : (toast('Ghi lý do báo nhầm vào ô ghi chú.', true), note.focus()))),
      el('h3', {}, 'Cảnh báo trong case'),
      (c.alerts || []).length ? el('ul', { cls: 'items' }, c.alerts.map(a => el('li', { cls: 'link', tabindex: '0',
        onClick: () => go('#/alerts/' + a._id), onKeydown: e => { if (e.key === 'Enter') go('#/alerts/' + a._id); } },
        sev(a.severity), ' ', el('b', {}, a.rule.name || a.rule.id), ' ', stLabel(ALERT_ST, a.status), el('div', { cls: 'sub' }, fmt(a['@timestamp'])))))
        : el('p', { cls: 'sub' }, 'Không còn dữ liệu cảnh báo.'),
      el('h3', {}, 'Lịch sử'), hist((c.notes || []).slice().reverse())),
  ];
}

// ============================================================================ vẽ trang + làm mới
// force: bộ lọc vừa đổi -> tải lại danh sách. Chỉ đổi alert / case đang mở (cùng trang) thì không tải lại danh sách.
let GEN = 0;          // số thứ tự lần vẽ: lần vẽ cũ (người dùng đã chuyển trang trong lúc chờ API) dừng lại
async function render(force = false) {
  const gen = ++GEN, r = route(), v = VIEWS[r.view];
  const key = r.view + '?' + r.params.toString();
  const sameView = CURRENT_KEY === key && listState[r.view] != null;
  if (!sameView && v.fromRoute) v.fromRoute(r);       // tham số trên địa chỉ (vd liên kết từ Grafana) -> bộ lọc của trang
  for (const a of document.querySelectorAll('#nav a')) {
    if (a.dataset.view === r.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  $('#title').textContent = v.title;
  document.title = v.title + ' – SIEM/XDR';
  if (!sameView || force || !v.list) $('#tools').replaceChildren(...[].concat(v.tools ? v.tools() : []));
  try {
    if (v.list) { showList(); if (CURRENT !== r.view) { $('#content').replaceChildren(); listState[r.view] = null; } }
    CURRENT = r.view; CURRENT_KEY = key;
    if (!v.list || force || !sameView) await v.load();
    if (gen !== GEN) return;
    if ((r.view === 'alerts' || r.view === 'cases') && r.id) await openDrawer(r.view === 'alerts' ? 'alert' : 'case', r.id);
    else if (drawer.kind) closeDrawer();
    syncOk();
  } catch (e) {
    if (gen !== GEN) return;
    if (e.code === 404 && r.id) { toast(sentence(e.message), true); go('#/' + r.view); return; }
    syncFail(e);
    if (e.code !== 401 && v.list) $('#content').prepend(el('div', { cls: 'notice', role: 'alert' }, 'Không tải được dữ liệu: ' + sentence(e.message) + ' Đang thử lại.'));
  }
}
let CURRENT = null, CURRENT_KEY = null;
async function refreshNow(auto = false) {
  try {
    await loadStats(auto);
    const r = route(), v = VIEWS[r.view];
    if (v.list) await v.load(auto);
    if (drawer.kind && !(auto && drawerBusy())) await openDrawer(drawer.kind, drawer.id, true);
    syncOk();
  } catch (e) { syncFail(e); }
}
// làm mới tự động 10 giây/lần (không tính là thao tác -> quên màn hình vẫn hết phiên); ẩn tab thì nghỉ
setInterval(() => { if (ME && !document.hidden) refreshNow(true); }, 10000);
document.addEventListener('visibilitychange', () => { if (ME && !document.hidden) refreshNow(true); });
window.addEventListener('hashchange', () => render());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drawer.kind) { go('#/' + route().view); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    const s = $('#tools input[type=search]'); if (s) { e.preventDefault(); s.focus(); }
  }
});

// ============================================================================ khởi động
function showMe() {
  $('#me').replaceChildren(el('b', {}, ME.username), el('span', { cls: 'role' }, { analyst: 'Analyst', lead: 'Trưởng nhóm IR', admin: 'Quản trị' }[ME.role] || ME.role),
    el('div', { cls: 'links' },
      el('button', { type: 'button', cls: 'linkbtn', onClick: () => location.assign('/login?change=1&next=' + encodeURIComponent('/' + location.hash)) }, 'Đổi mật khẩu'),
      el('button', { type: 'button', cls: 'linkbtn', onClick: async () => {
        LEAVING = true; ME = null;                     // dừng tự làm mới
        try { await api('/api/v1/auth/logout', { method: 'POST' }); } catch (e) {}
        location.replace('/login?reason=logged_out'); } }, 'Đăng xuất')),
    el('div', { cls: 'idle' }, `Tự đăng xuất sau ${ME.idle_minutes} phút không thao tác`));
}
for (const f of document.querySelectorAll('.frame iframe')) hookFrame(f);
(async () => {
  try { ME = await api('/api/v1/auth/me'); } catch (e) { if (e.code !== 401) toLogin(''); return; }
  if (ME.must_change) { toLogin('', true); return; }
  buildNav(); showMe();
  loadStats().catch(syncFail);
  render();
})();
</script>
