# SIEM/XDR — pipeline theo BTL/SIEM.txt:
#   Wazuh agent -> wazuh-manager -> (archives/alerts.json) -> Vector -> Kafka (KRaft) -> Analyzer (Rule) -> Elasticsearch -> Grafana
#   Syslog (firewall, Suricata) -> Vector ------------------------------------------^
#   SOAR -> Wazuh API (active response) -> script siem-xdr trên agent (XDR)
#
# Tên project cố định (không phụ thuộc tên thư mục): volume siem-xdr_esdata, siem-xdr_wazuh_etc... COMPOSE_PROJECT_NAME
# trong .env (install.sh tự ghi) được ưu tiên hơn `name:`.
#
# Bảo mật nội bộ:
#   - TLS: CA nội bộ do es-certs sinh (volume certs). Elasticsearch HTTPS + transport TLS; manager HTTPS.
#   - RBAC: mỗi service một user Elasticsearch với quyền tối thiểu (security/setup.sh).
#   - Bí mật: file trong ./secrets (tạo bằng `python tools/init_secrets.py`), mount qua Docker secrets,
#     KHÔNG nằm trong .env / biến môi trường. Mật khẩu superuser `elastic` nằm trong keystore của Elasticsearch.
# Giới hạn còn lại: Kafka chạy plaintext trong mạng docker nội bộ `soc-lab` (không publish ra ngoài).

name: siem-xdr

x-app-env: &app-env
  KAFKA_BOOTSTRAP: kafka:9092
  ES_URL: https://elasticsearch:9200
  ES_CA_CERT: /certs/ca/ca.crt
  DATA_DIR: /data

x-ca-mount: &ca-mount
  type: volume
  source: certs
  target: /certs/ca
  read_only: true
  volume: {subpath: ca}

x-app: &app
  build: ./server
  image: siem-xdr-server:latest
  restart: unless-stopped
  # python chạy làm PID 1 bỏ qua SIGTERM (không có handler) -> docker stop treo 10 giây rồi SIGKILL;
  # SIGINT thì thoát ngay qua KeyboardInterrupt, kịp đóng consumer Kafka (commit offset đã xử lý)
  stop_signal: SIGINT
  env_file: .env
  networks: [soc]
  depends_on:
    kafka: {condition: service_healthy}
    elasticsearch: {condition: service_healthy}
    es-setup: {condition: service_completed_successfully}

services:
  # ---------------------------------------------------------------- bảo mật
  es-certs:   # bước 1: CA + chứng chỉ TLS (chạy trước Elasticsearch)
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    user: "0"
    command: ["bash", "/security/setup.sh", "certs"]
    environment:
      MANAGER_TLS_IPS: ${MANAGER_TLS_IPS:-}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./security:/security:ro
      - essnapshots:/snapshots                       # chỉ để cấp quyền thư mục cho uid elasticsearch (1000)
    secrets: [elastic_password]
    networks: [soc]

  es-setup:   # bước 2: role + user RBAC (chạy sau khi Elasticsearch healthy)
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    user: "0"
    command: ["bash", "/security/setup.sh", "users"]
    environment:
      EVENTS_RETENTION_DAYS: ${EVENTS_RETENTION_DAYS:-30}   # index event cũ hơn N ngày bị ILM xóa
      # snapshot hằng ngày (SLM) vào volume essnapshots: giờ chạy theo cron UTC (18:30 UTC = 01:30 giờ VN), giữ N ngày
      SNAPSHOT_SCHEDULE: "${SNAPSHOT_SCHEDULE:-0 30 18 * * ?}"
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-30}
    depends_on:
      elasticsearch: {condition: service_healthy}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - ./security:/security:ro
    secrets: [elastic_password, manager_es_password, analyzer_es_password, soar_es_password, grafana_es_password, analyst_es_password, ai_es_password]
    networks: [soc]

  # ---------------------------------------------------------------- hạ tầng
  # Kafka chế độ KRaft (không ZooKeeper): 1 node vừa là broker vừa là controller (metadata quorum).
  # Controller dùng listener riêng CONTROLLER:9093, chỉ trong mạng nội bộ, không quảng bá cho client.
  # CLUSTER_ID sinh bằng `kafka-storage random-uuid`, cố định để volume kafkadata dùng lại được khi tạo lại container.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: 4QE4OUyBRDWV_gJxSy_LeQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [soc]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on: [kafka]
    ports: ["127.0.0.1:8088:8080"]   # chỉ truy cập từ máy chạy docker
    environment:
      KAFKA_CLUSTERS_0_NAME: soc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # không đăng nhập -> chỉ cho xem: gửi được message vào siem.alerts là giả được alert, SOAR sẽ chặn IP / kill thật
      KAFKA_CLUSTERS_0_READONLY: "true"
    networks: [soc]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    depends_on:
      es-certs: {condition: service_completed_successfully}
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      # es-certs chép từ Docker secret sang đây (quyền 600); image ghi vào keystore (bootstrap.password)
      ELASTIC_PASSWORD_FILE: /usr/share/elasticsearch/config/certs/bootstrap/elastic_password
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      path.repo: /usr/share/elasticsearch/snapshots           # repository snapshot kiểu fs (security/setup.sh)
    ports: ["127.0.0.1:9200:9200"]
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - esdata:/usr/share/elasticsearch/data
      # Snapshot hằng ngày. Triển khai thật: gắn thư mục này vào ổ / NAS / object storage khác máy chạy ES (mất máy là mất
      # cả dữ liệu lẫn bản sao lưu nếu để cùng ổ); xem SOC-OPERATIONS.md mục 5 và tools/es_snapshot.py
      - essnapshots:/usr/share/elasticsearch/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [soc]

  # Grafana KHÔNG mở cổng ra ngoài: chỉ vào qua manager https://localhost:8000/grafana/, dùng chung tài khoản + phiên
  # với SOC console (server/siem/manager/grafana_proxy.py). Chế độ auth proxy: form đăng nhập, basic auth và phiên
  # riêng của Grafana đều tắt; danh tính lấy từ header X-WEBAUTH-USER/ROLE, chỉ tin khi đến từ IP của manager trên
  # mạng riêng grafana-auth. Grafana chỉ lắng nghe trên mạng đó (mạng soc chỉ dùng để truy vấn Elasticsearch),
  # nên container khác trong lab (vd. máy web demo bị chiếm) không gọi thẳng được Grafana.
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      es-setup: {condition: service_completed_successfully}
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/siem-overview.json
      GF_SERVER_HTTP_ADDR: 10.250.30.11
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost:8000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: "Name:X-WEBAUTH-NAME Role:X-WEBAUTH-ROLE"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_SYNC_TTL: "1"                     # đổi vai trò trong console -> Grafana cập nhật sau <= 1 phút
      GF_AUTH_PROXY_WHITELIST: 10.250.30.10           # chỉ manager
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"       # không tạo phiên Grafana riêng: mỗi request đều qua phiên console
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: /logout           # Sign out trong Grafana -> đăng xuất phiên console
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_ALLOW_EMBEDDING: "true"             # console nhúng dashboard; manager vẫn chỉ cho nhúng cùng origin
      GF_LIVE_MAX_CONNECTIONS: "0"                    # proxy không chuyển WebSocket; dashboard tự làm mới theo chu kỳ
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets: [grafana_admin_password, grafana_es_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
      - *ca-mount
    networks:
      soc: {}
      grafana-auth:
        ipv4_address: 10.250.30.11
        aliases: [grafana-internal]

  # ---------------------------------------------------------------- SIEM/XDR
  # SOC console + API cho analyst (alert, case, lệnh phản ứng thủ công, duyệt đề xuất AI). Không còn nhận agent:
  # agent là Wazuh agent, kết nối tới wazuh-manager.
  manager:
    <<: *app
    command: ["uvicorn", "siem.manager.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--ssl-keyfile", "/certs/manager/manager.key", "--ssl-certfile", "/certs/manager/manager.crt"]
    ports: ["8000:8000"]
    networks:
      soc: {}
      grafana-auth:
        ipv4_address: 10.250.30.10                    # = GF_AUTH_PROXY_WHITELIST của grafana
    environment:
      <<: *app-env
      ES_USER: siem_manager
      ES_PASSWORD_FILE: /run/secrets/manager_es_password
      # đăng nhập console bằng tài khoản riêng (manager/auth.py); secret này chỉ dùng tạo tài khoản admin đầu tiên
      CONSOLE_ADMIN_PASSWORD_FILE: /run/secrets/console_admin_password
      DATASETS_DIR: /datasets   # bộ mẫu vàng để kiểm tra lại đề xuất AI ngay trước khi triển khai
    secrets: [manager_es_password, console_admin_password]
    volumes:
      - *ca-mount
      - {type: volume, source: certs, target: /certs/manager, read_only: true, volume: {subpath: manager}}
      # duyệt đề xuất AI: manager CHỈ ghi được 2 thư mục rules/ai và rules/exceptions, rule gốc chỉ đọc
      - ./server/rules:/app/rules:ro
      - ./server/rules/ai:/app/rules/ai
      - ./server/rules/exceptions:/app/rules/exceptions
      - ./server/config:/app/config:ro                # priority.yml (ưu tiên / SLA), threat_profile.yml (độ phủ ATT&CK)
      - ./datasets/processed:/datasets:ro

  # Syslog collector: Vector (Rust) thay cho bản Python cũ (siem/collector/syslog_server.py, giữ lại để đối chiếu).
  # Nhận UDP/TCP 514 -> hàng đợi trên đĩa (volume vectordata) -> Kafka siem.raw. Xem vector/vector.yaml.
  # Trên máy Linux thật nên đặt ở HOST: sysctl -w net.core.rmem_max=33554432 (để buffer UDP 32 MB có hiệu lực).
  syslog:
    image: timberio/vector:0.58.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    ports: ["514:514/udp", "514:514/tcp"]
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vectordata:/var/lib/vector
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [soc]

  # Wazuh manager 4.14.7: trạm thu của Wazuh agent (Windows/Linux). Chỉ dùng manager (không indexer/dashboard/filebeat):
  # event + cảnh báo đi tiếp qua wazuh-forwarder vào Kafka. Cấu hình: wazuh/manager/ (xem README mục 1).
  #   1514/tcp  agent gửi event (mã hóa AES)       1515/tcp  enroll agent (TLS + mật khẩu secrets/enrollment_key)
  #   55000     Wazuh API: KHÔNG publish, chỉ SOAR gọi trong mạng docker (user siem-soar, quyền tối thiểu)
  # Agent không được mới hơn manager: dùng bộ cài agent 4.14.7 trở xuống.
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh-manager
    restart: unless-stopped
    depends_on:
      es-certs: {condition: service_completed_successfully}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 655360, hard: 655360}
    ports: ["1514:1514", "1515:1515"]
    environment:
      # agent im lặng bao lâu thì Wazuh coi là "disconnected" (entrypoint/10-siem-setup.sh ghi vào ossec.conf); lab: 1m
      WAZUH_AGENTS_DISCONNECTION_TIME: ${WAZUH_AGENTS_DISCONNECTION_TIME:-10m}
    secrets: [enrollment_key, wazuh_api_password]
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      # /wazuh-config-mount: image chép đè vào /var/ossec mỗi lần khởi động
      - ./wazuh/manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./wazuh/manager/agent.conf:/wazuh-config-mount/etc/shared/default/agent.conf:ro
      - ./wazuh/manager/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - ./wazuh/manager/api.yaml:/wazuh-config-mount/api/configuration/api.yaml:ro
      - ./wazuh/manager/entrypoint:/entrypoint-scripts:ro     # mật khẩu enroll, user API, tắt filebeat
      - {type: volume, source: certs, target: /certs/wazuh, read_only: true, volume: {subpath: wazuh-manager}}
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running' && /var/ossec/bin/wazuh-control status | grep -q 'wazuh-apid is running'"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [soc]

  # Đọc archives.json / alerts.json của wazuh-manager (volume wazuh_logs, chỉ đọc) -> Kafka siem.raw. Xem vector/wazuh.yaml.
  wazuh-forwarder:
    image: timberio/vector:0.58.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/wazuh.yaml"]
    volumes:
      - ./vector/wazuh.yaml:/etc/vector/wazuh.yaml:ro
      - ./vector/wazuh-tests.yaml:/etc/vector/wazuh-tests.yaml:ro
      - {type: volume, source: wazuh_logs, target: /wazuh-logs, read_only: true}
      - vectorwazuh:/var/lib/vector
    depends_on:
      kafka: {condition: service_healthy}
      wazuh-manager: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [soc]

  analyzer:
    <<: *app
    command: ["python", "-m", "siem.analyzer"]
    environment:
      <<: *app-env
      ES_USER: siem_analyzer
      ES_PASSWORD_FILE: /run/secrets/analyzer_es_password
      MISP_API_KEY_FILE: /run/secrets/misp_api_key   # feed IOC từ MISP khi đặt MISP_URL trong .env (pipeline/misp.py)
    secrets: [analyzer_es_password, misp_api_key]
    volumes:
      - ./server/rules:/app/rules:ro
      - ./server/config:/app/config:ro
      - mldata:/data
      - *ca-mount

  # SOAR: playbook -> lệnh phản ứng -> Wazuh API (active response) -> agent; đồng bộ danh sách agent từ Wazuh
  soar:
    <<: *app
    command: ["python", "-m", "siem.soar"]
    environment:
      <<: *app-env
      ES_USER: siem_soar
      ES_PASSWORD_FILE: /run/secrets/soar_es_password
      WAZUH_API_URL: https://wazuh-manager:55000
      WAZUH_API_USER: siem-soar
      WAZUH_API_PASSWORD_FILE: /run/secrets/wazuh_api_password
      MISP_API_KEY_FILE: /run/secrets/misp_api_key   # dò ngược log cũ cả với IOC mới từ MISP (soar/retrohunt.py)
    secrets: [soar_es_password, wazuh_api_password, misp_api_key]
    volumes:
      - ./server/config:/app/config:ro
      - *ca-mount

  # ---------------------------------------------------------------- AI hỗ trợ viết rule (profile ai)
  # LLM chạy nội bộ, không publish cổng ra ngoài. GPU: thêm -f docker-compose.gpu.yml
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [ai]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    # model nặng 5-7 GB mỗi cái: OLLAMA_MODELS_DIR (trong .env) đặt sang ổ khác nếu ổ chứa dữ liệu Docker sắp đầy
    volumes: ["${OLLAMA_MODELS_DIR:-ollama}:/root/.ollama"]
    networks: [soc]

  ai-worker:
    <<: *app
    profiles: [ai]
    command: ["python", "-m", "siem.ai"]
    environment:
      <<: *app-env
      ES_USER: siem_ai
      ES_PASSWORD_FILE: /run/secrets/ai_es_password
      OLLAMA_URL: http://ollama:11434
      DATASETS_DIR: /datasets
    secrets: [ai_es_password]
    volumes:
      - ./server/rules:/app/rules:ro
      - ./server/config:/app/config:ro
      - ./datasets/processed:/datasets:ro
      - *ca-mount
    depends_on:
      elasticsearch: {condition: service_healthy}
      es-setup: {condition: service_completed_successfully}
      ollama: {condition: service_started}

  # Máy chủ web demo (vai trò S001) có cài Wazuh agent 4.14.7 — dùng để kiểm tra luồng XDR end-to-end
  demo-web:
    build: {context: ., dockerfile: demo/web/Dockerfile}
    restart: unless-stopped
    profiles: [demo]
    hostname: demo-web
    # tini làm PID 1: tiến trình mồ côi (vd shell ngắn hạn của lượt quét SCA / rootcheck) được gán cho tini chứ không
    # cho httpd. Thiếu dòng này thì httpd là PID 1 và mọi tiến trình mồ côi trông như "web server sinh shell" ->
    # LNX-002 báo nhầm, SOAR còn tự kill (đã gặp 3/10: 2 alert critical lúc agent chạy quét SCA)
    init: true
    cap_add: [NET_ADMIN]     # iptables cho block_ip / isolate_host
    secrets: [enrollment_key]
    volumes:
      - demo_wazuh_etc:/var/ossec/etc   # giữ khóa agent (client.keys) khi tạo lại container
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      wazuh-manager: {condition: service_healthy}
    networks: [soc]

secrets:
  elastic_password:       {file: ./secrets/elastic_password}
  manager_es_password:    {file: ./secrets/manager_es_password}
  analyzer_es_password:   {file: ./secrets/analyzer_es_password}
  soar_es_password:       {file: ./secrets/soar_es_password}
  grafana_es_password:    {file: ./secrets/grafana_es_password}
  analyst_es_password:    {file: ./secrets/analyst_es_password}
  grafana_admin_password: {file: ./secrets/grafana_admin_password}
  enrollment_key:         {file: ./secrets/enrollment_key}
  console_admin_password: {file: ./secrets/console_admin_password}
  ai_es_password:         {file: ./secrets/ai_es_password}
  wazuh_api_password:     {file: ./secrets/wazuh_api_password}
