# Ca test cho wazuh/manager/rules/0542-ti.xml (TI-001). Rule đọc danh sách etc/lists/siem-misp-ip, nội dung do SOAR đẩy lên lúc chạy thật
# (server/siem/pipeline/misp_cdb.py); ở đây phần tử `list_file` đầu file đẩy một danh sách thử qua Wazuh API rồi nạp lại ruleset (bộ chạy làm).
# 45.9.9.77, 45.9.9.8 và 45.9.9.9 chỉ có trong danh sách MISP (CIDR do SOAR triển khai thành từng địa chỉ: Wazuh 4.14.8 không khớp khóa CIDR); 196.251.85.62 có trong CẢ danh sách MISP lẫn danh sách gốc malicious-ip của Wazuh (99915 / 99916).
# Hai đường vào của filterlog như 0541-network.xml: agent OPNsense (location (fw01) any->...) và syslog 514 (location = IP thiết bị).
# Suricata chỉ qua agent (eve.json, log_format json).
# Danh sách thử còn lại trên manager sau khi chạy: dùng dải 45.9.9.x vì ca của file khác dùng 192.0.2.x / 198.51.100.x / 203.0.113.x và sẽ trúng TI-001 nếu IP trùng.

- list_file:
    name: siem-misp-ip
    content: |
      45.9.9.77:misp
      45.9.9.8:misp
      45.9.9.9:misp
      196.251.85.62:misp

# ---------------------------------------------------------------- firewall (107001 nguồn, 107002 đích)
- rule: 107001   # block: nguồn là IOC
  legacy: TI-001
  log_format: syslog
  location: (fw01) any->/var/ossec/logs/opnsense_syslog.log
  events:
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,block,in,4,0x0,,64,12345,0,none,6,tcp,60,45.9.9.77,10.0.0.5,50000,8000,0,S,123456,,64240,,mss'

- rule: 107001   # pass: nguồn là địa chỉ IOC thứ hai
  log_format: syslog
  location: (fw01) any->/var/ossec/logs/opnsense_syslog.log
  events:
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,pass,in,4,0x0,,64,12345,0,none,6,tcp,60,45.9.9.9,10.0.0.5,50000,8000,0,S,123456,,64240,,mss'

- rule: 107001   # đường syslog 514 của manager
  log_format: syslog
  location: 10.10.40.254
  events:
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,pass,in,4,0x0,,64,12345,0,none,6,tcp,60,45.9.9.77,10.0.0.5,50000,8000,0,S,123456,,64240,,mss'

- rule: 107002   # pass: máy nội bộ nối ra IP IOC
  legacy: TI-001
  log_format: syslog
  location: (fw01) any->/var/ossec/logs/opnsense_syslog.log
  events:
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,pass,out,4,0x0,,64,12345,0,none,6,tcp,60,10.0.0.60,45.9.9.77,50000,443,0,S,123456,,64240,,mss'

- rule: 107002   # block: đích là địa chỉ IOC; đường syslog 514
  log_format: syslog
  location: 10.10.40.254
  events:
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,block,out,4,0x0,,64,12345,0,none,6,tcp,60,10.0.0.60,45.9.9.8,50000,443,0,S,123456,,64240,,mss'

- rule: 107003   # nguồn IOC được cho phép vào SSH (cổng quản trị): NET-003 báo, TI-001 là con của nó nên vẫn là rule cuối
  legacy: TI-001
  log_format: syslog
  location: (fw01) any->/var/ossec/logs/opnsense_syslog.log
  events:
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,pass,in,4,0x0,,64,12345,0,none,6,tcp,60,45.9.9.77,10.0.0.5,50000,22,0,S,123456,,64240,,mss'

- none: [107001, 107002, 107003]   # IP sát địa chỉ IOC (45.9.9.10, 45.9.9.78), IP nội bộ
  legacy: TI-001
  log_format: syslog
  location: (fw01) any->/var/ossec/logs/opnsense_syslog.log
  events:
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,pass,in,4,0x0,,64,12345,0,none,6,tcp,60,45.9.9.10,10.0.0.5,50000,8000,0,S,123456,,64240,,mss'
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,block,in,4,0x0,,64,12345,0,none,6,tcp,60,45.9.9.78,10.0.0.5,50000,8000,0,S,123456,,64240,,mss'
  - 'Oct 31 10:00:00 OPNsense.localdomain filterlog[1234]: 5,,,1000000103,em0,match,pass,out,4,0x0,,64,12345,0,none,6,tcp,60,10.0.0.60,10.0.0.5,50000,8000,0,S,123456,,64240,,mss'

