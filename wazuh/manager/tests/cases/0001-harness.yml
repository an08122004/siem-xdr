# Ca kiểm chính bộ chạy trên đường logtest (rule gốc của Wazuh, không phải rule của repo).
- rule: 5710                  # sshd: đăng nhập user không tồn tại
  log_format: syslog
  location: /var/log/auth.log
  events:
    - 'Oct 31 10:00:00 host sshd[1234]: Failed password for invalid user admin from 203.0.113.5 port 4444 ssh2'

- none: [5710]
  log_format: syslog
  location: /var/log/auth.log
  events:
    - 'Oct 31 10:00:00 host sshd[1234]: Accepted password for alice from 203.0.113.5 port 4444 ssh2'
