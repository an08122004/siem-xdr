# R63: ca ghim cho rule gốc alert thật nằm dưới rule cha bị rule dự án móc qua `if_group` (cha 61603 sysmon_event1, 5715 authentication_success),
# lộ ra khi tools/wazuh_stock_reach.py theo if_group. Rule dự án cùng cha (105005-105007 sysmon, 101002/101004 sshd) có level cao hơn hoặc bằng và nạp trước con trực tiếp của cha,
# nên không có bảo đảm cấu trúc: mỗi ca chứng minh rule gốc vẫn báo khi MỌI rule dự án đã nạp. Sysmon sự kiện 1 qua bơm hàng đợi (mỗi ca một event).

