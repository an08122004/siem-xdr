# Ca test cho wazuh/manager/rules/0999-tuning.xml (Task 12): rule GỐC bị ghi đè bằng overwrite="yes". Mỗi rule bị đè có ca dương (vẫn báo), ca âm (đã yên), và rule con chính vẫn chạy.
# Eventchannel bơm hàng đợi analysisd (không giữ thứ tự dòng; chỉ thấy rule có alert level >= log_alert_level). Ca đếm syslog/apache dùng IP riêng của từng ca.
# R52 (cuối file): thất bại / thành công sshd từ IP trong danh sách gốc malicious-ip do 99904 / 99903 giữ event, không vào bộ đếm 101000 của AUTH.

# ===== 92041: regex khớp mọi `reg add ... /d`; nay chỉ giá trị /d giống Base64 (>= 20 ký tự chữ-số-+/ có ít nhất một chữ số, đệm = tùy chọn)

