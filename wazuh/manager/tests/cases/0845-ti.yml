  location: 10.10.40.254
  events:
  - '45.9.9.77 - - [31/Oct/2026:10:00:00 +0700] "GET /index.html HTTP/1.1" 200 12 "-" "curl/8"'

- rule: 99906   # R57 KHÔNG MẤT alert thật: IP có ở CẢ HAI danh sách + SQLi + 200 -> cây gốc 31103 -> 99905 -> 99906 (level 14), TI-001 nhường
  log_format: apache
  location: (web01) any->/var/log/apache2/access.log
  events:
  - '196.251.85.62 - - [31/Oct/2026:10:00:00 +0700] "GET /index.php?id=1%27%20union%20select%20password%20from%20users-- HTTP/1.1" 200 12 "-" "curl/8"'

