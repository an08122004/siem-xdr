- rule: 92650   # 92650: dịch vụ mới 7045 chạy từ %systemroot%\evil.exe, một dấu gạch chéo ngược thật (analysisd nhân đôi khi dựng trường nên regex của 92650 đòi hai) (cha 61138). 105009 cần đường dẫn temp/appdata/powershell/cmd /c, mà regex của 92650 chốt cả chuỗi ^%systemroot%\\\w+.exe$ nên không dựng được event thỏa cả hai; ca dương trơn
  log_format: eventchannel
