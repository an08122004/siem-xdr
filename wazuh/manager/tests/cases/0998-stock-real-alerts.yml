# Ca test cho 14 rule GỐC (stock Wazuh 4.14.8) mà đang là alert thật nhưng chưa có ca dương nào: 60154 60156 60159 60162 60164 60166 60171 60176 60187 60188 60189 92650 92602 99920.
# VÌ SAO: Wazuh thử các rule anh em theo level giảm dần (hòa thì rule nạp trước), rule thắng cắt cả cây con của rule còn lại. Rule dự án móc dưới rule cha gốc (60141..60152 / 60103,
# 61138 / 60106 / 92600) có thể lặng lẽ chặn rule gốc con của các cha đó. Ca dương ở đây chứng minh rule gốc vẫn báo khi MỌI rule dự án đã nạp; ca có `none:` thêm: rule dự án đối thủ không báo trên chính event đó.
# DANH SÁCH rút từ cây rule (tools/wazuh_stock_reach.py): mọi hậu duệ level >= 12 (hoặc >= 7 ở nhóm syscheck/rootcheck/vulnerability-detector/virustotal/yara) của rule cha gốc mà rule dự án móc vào, chưa có ca `rule:`.
#   60154 60156 60171 60176 60188 60189   nhóm local đổi thành viên (cha 60144/60145; đối thủ 105004, 105109)
#   60159 60162 60164                     nhóm global đổi thành viên (cha 60141/60142; đối thủ 105004, 105109)
#   60166 60187                           nhóm universal (cha 60149..60152; đối thủ 105109)
#   92650                                 dịch vụ mới từ %systemroot% (cha 61138; đối thủ 105009)
#   99920                                 đăng nhập từ xa từ IP độc hại gốc (cha 92651; đối thủ 107010, 105109)
#   92602                                 chữ ký Impacket trong auditd (cha 92600/92601; đối thủ 102501/102511)
# Bơm eventchannel không giữ thứ tự dòng, mỗi ca một event. Windows: event có EventRecordID riêng do bộ chạy đặt.

