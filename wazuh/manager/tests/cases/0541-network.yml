# Ca test cho wazuh/manager/rules/0541-network.xml (log gốc qua Wazuh thật). Nguồn: tests/legacy/network.yml + ca biên.
# HAI ĐƯỜNG VÀO của filterlog (R43): (1) agent OPNsense: syslog-ng ghi /var/ossec/logs/opnsense_syslog.log, agent đọc log_format syslog, rule thấy
# location `(fw01) any->/var/ossec/logs/opnsense_syslog.log` (S7); (2) thiết bị syslog gửi thẳng cổng 514 của manager (RFC 3164, agent 000), location = IP người gửi
# (10.10.40.254). Phần lớn ca chạy đường (1); đường (2) có ca riêng ở cuối file cho từng rule. Suricata chỉ tới rule qua agent (eve.json, log_format json);
