# CA ĐẾM (NET-001, NET-005): lịch sử đếm của analysisd còn giữ qua các lần chạy và logtest luôn là agent 000, nên mỗi ca đếm dùng
# một IP nguồn riêng (rule khai same_source_ip); phải khởi động lại manager thử (wzhdev) giữa hai lần chạy cả bộ.
# NET-002 (>= 50 chặn / 60 s) không có rule ở đây: chỉ khác 87702 ở ngưỡng, chuyển sang 0190-tuning (Task 12).

