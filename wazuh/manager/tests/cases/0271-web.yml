# Ca test cho wazuh/manager/rules/0271-web.xml (log gốc qua Wazuh thật). Nguồn: tests/legacy/web.yml + ca mã hóa (S5) + ca biên.
# Vị trí khớp rule của agent là `(demo-web) any-><đường dẫn>` (S7). Wazuh KHÔNG giải mã URL (S5), nên mỗi rule có nhánh payload đều có ca dạng thô VÀ dạng mã hóa
# (%27, %2527, %u0027, + thay dấu cách, %55NION từng chữ...). Ca đếm (WEB-007, WEB-009) dùng IP nguồn riêng cho từng ca vì rule khai same_source_ip;
# phải khởi động lại manager thử (wzhdev) giữa hai lần chạy cả bộ vì lịch sử đếm của analysisd còn giữ qua các lần chạy.
# WEB-006 (>= 30 phản hồi 404 / 60 s) không có rule ở đây: chỉ khác 31151 ở ngưỡng/level, chuyển sang 0190-tuning (Task 12).

- rule: 104090   # WEB-009 bộ đếm: một GET /index.html (level 2)
  log_format: apache
  location: (demo-web) any->/usr/local/apache2/logs/access_log
  events:
  - '198.51.100.1 - - [05/Jan/2026:09:00:00 +0000] "GET /index.html HTTP/1.1" 200 512 "-" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/129.0"'

- none: [104090]   # WEB-009 bộ đếm không nhận POST wp-login (31509/31510 sống)
  log_format: apache
  location: (demo-web) any->/usr/local/apache2/logs/access_log
  events:
  - '198.51.100.2 - - [05/Jan/2026:09:00:00 +0000] "POST /wp-login.php HTTP/1.1" 200 512 "-" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/129.0"'

