# Ca test cho wazuh/manager/rules/0965-windows.xml (event eventchannel của agent Windows, bơm hàng đợi analysisd). Nguồn: tests/legacy/windows.yml + ca biên.
# Bơm KHÔNG giữ thứ tự dòng: ca đếm (WIN-001) chỉ khẳng định rule báo ít nhất một lần; ca âm đếm dùng IP riêng cho từng ca (lịch sử đếm giữ qua các lần chạy -> khởi động lại manager thử trước mỗi lượt cả bộ).
# R51: ca cuối là ca âm GIẢ MẠO: cùng các event dưới dạng JSON gửi qua syslog (location = IP thiết bị) không được ra rule nào của file này.

