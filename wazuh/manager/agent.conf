<!--
  Cấu hình tập trung cho MỌI agent (nhóm default): manager tự đẩy xuống, agent áp dụng không cần sửa máy.
  Cộng thêm vào ossec.conf cục bộ của agent (bộ cài chính thức đã có sẵn: log hệ thống, Security/System/Application
  trên Windows, FIM thư mục hệ thống, rootcheck, SCA, syscollector).
-->
<agent_config os="Windows">
  <!-- Telemetry mà rule WIN-* cần: Sysmon (process/network/registry/DNS), PowerShell script block, Defender -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <syscheck>
    <!-- thư mục khởi động cùng Windows: nơi mã độc hay cài để tồn tại lâu dài -->
    <directories realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
  </syscheck>
</agent_config>

<agent_config os="Linux">
  <!-- Apache trên Debian/Ubuntu (S001 Web-01): file không tồn tại thì agent chỉ ghi cảnh báo -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>

  <syscheck>
    <!-- nội dung web và khóa SSH: thay đổi là dấu hiệu webshell / cài backdoor -->
    <directories realtime="yes" report_changes="yes">/var/www</directories>
    <directories realtime="yes">/root/.ssh,/etc/ssh</directories>
    <directories realtime="yes">/etc/cron.d,/etc/crontab,/var/spool/cron</directories>
  </syscheck>
</agent_config>
