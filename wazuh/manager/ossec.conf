<!--
  Wazuh manager cho siem-xdr: CHỈ làm trạm thu của Wazuh agent.
    - nhận event từ agent (1514/tcp, AES) và enroll agent (1515/tcp, TLS + mật khẩu = secrets/enrollment_key)
    - giải mã + chạy ruleset Wazuh, ghi MỌI event ra logs/archives/archives.json và cảnh báo ra logs/alerts/alerts.json
      -> Vector (vector/wazuh.yaml) đẩy cả hai vào Kafka siem.raw -> analyzer của siem-xdr (rule riêng, AI, ES, SOAR)
    - nhận lệnh phản ứng từ SOAR qua Wazuh API (55000, chỉ trong mạng docker) và chuyển xuống agent
  Không dùng Wazuh indexer/dashboard/filebeat: lưu trữ và hiển thị là Elasticsearch + Grafana + console của siem-xdr.
  Cấu hình mặc định cho agent (FIM, log Windows...) nằm ở agent.conf (nhóm default), đẩy xuống agent tự động.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>no</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>           <!-- archives.json: toàn bộ event, kể cả không khớp rule nào -->
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>no</update_check>          <!-- lab cô lập: không gọi ra Internet kiểm tra phiên bản -->
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Syslog 514 (firewall, Suricata, router) vào thẳng wazuh-manager, thay container Vector `syslog` cũ: mọi dữ liệu đi qua
       Wazuh trước. allowed-ips BẮT BUỘC (UDP giả mạo được; syslog giả có thể khiến SOAR tự chặn IP tùy ý): entrypoint/10-siem-setup.sh
       ghi lại danh sách từ SYSLOG_ALLOWED_IPS mỗi lần khởi động, giá trị dưới đây chỉ là mặc định. -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.10.40.254</allowed-ips>
  </remote>
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>tcp</protocol>
    <allowed-ips>10.10.40.254</allowed-ips>
  </remote>

  <!-- Nhật ký SOC console (manager/auth.py) ghi mỗi sự kiện một dòng JSON vào volume console_audit; Wazuh đọc ở đây để
       console cũng đi qua wazuh-manager. Analyzer chỉ tin event có location ĐÚNG đường dẫn này (CONSOLE_AUDIT_WAZUH_PATH).
       File xoay vòng (RotatingFileHandler): logcollector theo dõi inode nên đọc tiếp file mới. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/siem-console/console.json</location>
  </localfile>

  <!-- Các module giám sát CHÍNH MÁY manager (container) không có ý nghĩa -> tắt. Agent vẫn chạy đủ các module này. -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>
  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>
  <sca>
    <enabled>no</enabled>
  </sca>
  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <!-- Vulnerability detection từ 4.8 lưu trạng thái vào Wazuh indexer, lab không dùng indexer -> tắt -->
  <vulnerability-detection>
    <enabled>no</enabled>
    <index-status>no</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>
  <indexer>
    <enabled>no</enabled>
  </indexer>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <!-- Enroll: agent phải có mật khẩu (etc/authd.pass, chép từ Docker secret enrollment_key khi container khởi động) -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key></key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>NODE_IP</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>

  <!-- Không cấu hình <active-response> tự động: quyết định phản ứng do SOAR của siem-xdr đưa ra (playbook,
       whitelist, cần duyệt...), rồi gọi Wazuh API chạy script siem-xdr trên agent. -->
</ossec_config>
