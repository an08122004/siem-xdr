# CI cho kho mã + kho rule (detection-as-code, SOC-OPERATIONS.md mục 4). Mọi thay đổi rule phải qua đây trước khi merge.
#   test     unit test server (SOAR, API, AI, cầu nối Wazuh...) trên Python 3.12 như image server
#   wazuh-rules  lint rule XML + chạy ca test log gốc (wazuh/manager/tests/cases) qua wazuh-manager thật: logtest + bơm hàng đợi
#   vector   unit test cấu hình Vector (Wazuh -> Kafka)
#   compose  docker compose config hợp lệ (secret giả, không chạy container)
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"          # 08:00 thứ Hai giờ Việt Nam: chạy lại hằng tuần
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt pytest httpx
      - name: Unit test
        working-directory: server
        run: python -m pytest -q

  # Dựng wazuh-manager 4.14.8 đúng như compose (rule, decoder, ossec.conf, entrypoint của repo, secret sinh bằng
  # init_secrets.py) nhưng không cần es-certs / Elasticsearch: chứng chỉ API tự ký bằng openssl, nên chạy test với --insecure.
  # api-ci.yaml nâng access.max_request_per_minute (mặc định 300 -> HTTP 429 khi chạy cả bộ ca).
  wazuh-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Lint rule XML
        run: python tools/wazuh_rule_lint.py
      - name: Dựng wazuh-manager
        run: |
          python3 tools/init_secrets.py
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=wazuh-manager"             -keyout certs/wazuh-manager.key -out certs/wazuh-manager.crt
          docker run -d --name wazuh-rules-ci -p 127.0.0.1:55000:55000             --ulimit memlock=-1:-1 --ulimit nofile=655360:655360             -v "$PWD/wazuh/manager/rules:/var/ossec/etc/rules:ro"             -v "$PWD/wazuh/manager/decoders:/var/ossec/etc/decoders:ro"             -v "$PWD/wazuh/manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro"             -v "$PWD/wazuh/manager/agent.conf:/wazuh-config-mount/etc/shared/default/agent.conf:ro"             -v "$PWD/wazuh/manager/tests/api-ci.yaml:/wazuh-config-mount/api/configuration/api.yaml:ro"             -v "$PWD/wazuh/manager/entrypoint:/entrypoint-scripts:ro"             -v "$PWD/certs:/certs/wazuh:ro"             -v "$PWD/secrets/enrollment_key:/run/secrets/enrollment_key:ro"             -v "$PWD/secrets/wazuh_api_password:/run/secrets/wazuh_api_password:ro"             -v "$PWD/secrets/wazuh_rules_api_password:/run/secrets/wazuh_rules_api_password:ro"             --health-cmd "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-apid is running' && /var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running'"             --health-interval 10s --health-retries 40             wazuh/wazuh-manager:4.14.8
      - name: Chờ manager healthy
        run: |
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' wazuh-rules-ci)
            [ "$st" = "running healthy" ] && exit 0
            case "$st" in "running "*) ;; *) break ;; esac     # container đã thoát
            [ "${st#running }" = unhealthy ] && break
            sleep 5
          done
          docker logs wazuh-rules-ci | tail -n 80
          exit 1
      # analysisd bỏ rule hỏng (cha không tồn tại / nạp sau, id trùng, regex sai) chỉ bằng một dòng log, HTTP vẫn 200: quét log ngay sau khi manager healthy.
      # Chỉ lấy dòng của analysisd / testrule (manager CI không có indexer nên ERROR của indexer-connector, filebeat, vulnerability-detector là bình thường):
      #   WARNING (7617) Signature ID '...' was not found ... 'if_sid' option of rule '...'   cha không tồn tại hoặc chưa nạp
      #   WARNING (7619) Empty 'if_sid' value. Rule '...' will be ignored.                    rule bị bỏ vì mọi cha đều không có
      #   WARNING (7612) Rule ID '...' is duplicated.                                         id trùng
      #   ERROR / CRITICAL của analysisd (vd 5107 Syntax error on tag, 1220 Error loading the rules)
      # (7605 "not possible to overwrite 'if_group'" của 0999-tuning.xml là vô hại: Wazuh giữ if_group gốc.)
      - name: ossec.log không có lỗi nạp rule của analysisd
        run: |
          bad=$(docker exec wazuh-rules-ci grep -E 'wazuh-(analysisd|testrule): (ERROR|CRITICAL)|wazuh-(analysisd|testrule): WARNING: \((7617|7619|7612)\)' /var/ossec/logs/ossec.log || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Mọi alert thật của rule gốc dưới rule cha bị rule dự án móc đều có ca ghim hoặc bảo đảm cấu trúc
        run: |
          docker cp wazuh-rules-ci:/var/ossec/ruleset/rules stock-rules
          python tools/wazuh_stock_reach.py stock-rules
      - name: Chạy ca test log gốc qua Wazuh
        run: python tools/wazuh_rule_test.py --url https://localhost:55000 --insecure wazuh/manager/tests/cases
      - name: Log manager khi lỗi
        if: failure()
        run: docker logs wazuh-rules-ci | tail -n 120

  vector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit test cấu hình Vector
        run: |
          docker run --rm -v "$PWD/vector:/etc/vector:ro" timberio/vector:0.58.0-alpine test /etc/vector/wazuh.yaml /etc/vector/wazuh-tests.yaml

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          python3 tools/init_secrets.py
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ai --profile demo config -q
