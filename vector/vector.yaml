# Syslog collector bằng Vector (thay cho siem/collector/syslog_server.py viết bằng Python).
#
#   thiết bị (firewall F001, Suricata, router...) --UDP/TCP 514--> Vector --(hàng đợi đĩa)--> Kafka siem.raw
#
# Vì sao thay: bản Python (asyncio, 1 luồng) chỉ xử lý ~10-13 nghìn msg/s qua UDP và làm rơi log
# KHÔNG báo lỗi khi tăng đột biến (xem README, mục "Đánh giá syslog collector"). Vector viết bằng Rust,
# nhận UDP/TCP nhanh hơn nhiều, có buffer nhận lớn, hàng đợi trên đĩa khi Kafka chậm/chết,
# và có metrics để biết log vào/ra/bị loại.
#
# Output giữ ĐÚNG định dạng event thô mà analyzer đang đọc (giống hệt bản Python):
#   {"timestamp", "agent_id": "syslog-<ip>", "source": "syslog", "event_type": "syslog",
#    "data": {"message": <dòng syslog gốc>, "sender_ip": <ip>}}
# Kiểm thử cấu hình: vector test /etc/vector/vector.yaml /etc/vector/tests.yaml

data_dir: /var/lib/vector

api:                      # chỉ dùng cho healthcheck, không publish ra ngoài
  enabled: true
  address: 0.0.0.0:8686

sources:
  syslog_udp:
    type: socket
    mode: udp
    address: 0.0.0.0:514
    receive_buffer_bytes: 33554432      # SO_RCVBUF 32 MB: chịu được đợt tăng đột biến ngắn
    framing:
      method: newline_delimited         # 1 datagram có thể chứa nhiều dòng
      newline_delimited:
        max_length: 65536
    decoding:
      codec: bytes

  syslog_tcp:
    type: socket
    mode: tcp
    address: 0.0.0.0:514
    receive_buffer_bytes: 33554432
    framing:
      method: newline_delimited
      newline_delimited:
        max_length: 65536
    decoding:
      codec: bytes

  vector_metrics:
    type: internal_metrics

transforms:
  to_siem_raw:
    type: remap
    inputs: [syslog_udp, syslog_tcp]
    drop_on_abort: true
    source: |
      msg = strip_whitespace(string!(.message))
      if msg == "" { abort }
      ip = string(.host) ?? "unknown"
      . = {
        "timestamp": format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.6f%:z"),
        "agent_id": "syslog-" + ip,
        "source": "syslog",
        "event_type": "syslog",
        "data": {"message": msg, "sender_ip": ip}
      }

sinks:
  kafka_raw:
    type: kafka
    inputs: [to_siem_raw]
    bootstrap_servers: kafka:9092
    topic: siem.raw                     # ghi thẳng: Vector 0.58 không thay biến môi trường vào trường này
    key_field: agent_id                 # cùng thiết bị -> cùng partition (giữ thứ tự log)
    encoding:
      codec: json
    compression: lz4
    librdkafka_options:
      linger.ms: "20"
      acks: all
      enable.idempotence: "true"
    buffer:
      type: disk                        # Kafka chậm/chết -> log nằm chờ trên đĩa, không mất
      max_size: 1073741824              # 1 GiB
      when_full: block                  # đầy thì chặn (TCP đẩy ngược áp lực), không vứt log

  metrics:                              # http://syslog:9598/metrics (chỉ trong mạng docker)
    type: prometheus_exporter
    inputs: [vector_metrics]
    address: 0.0.0.0:9598
